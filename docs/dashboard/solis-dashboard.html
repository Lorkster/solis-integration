margin: 10px 0 2px; font-size: 13px; font-weight: 650; }\n    .schedule h3 .col { font-size: 11px; font-weight: 400; color: var(--c-muted); align-self: flex-end; }\n    .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }\n    .row + .row { border-top: 1px solid var(--c-grid); }\n    .day { margin-top: 6px; padding: 6px 0 2px; font-size: 11px; font-weight: 650; color: var(--c-muted); border-top: 1px solid var(--c-grid); }\n    .row .badge { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center;\n      color: var(--c); background: color-mix(in srgb, var(--c) var(--tint), transparent); }\n    .row .badge svg { width: 15px; height: 15px; }\n    .row .what { flex: 1; min-width: 0; }\n    .row .when { font-variant-numeric: tabular-nums; color: var(--c-muted); }\n    .row .target { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }\n\n    .footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: var(--homey-su-3, 12px); font-size: 11px; color: var(--c-muted); }\n    .footer .saves { padding: 4px 10px; border-radius: 999px; font-size: 12px;\n      color: color-mix(in srgb, var(--c-good) var(--on-tint), var(--c-ink)); background: color-mix(in srgb, var(--c-good) var(--tint), transparent); }\n    .footer b { font-weight: 650; }\n    .message { color: var(--c-muted); font-size: 13px; padding: var(--homey-su-4, 16px) 0; text-align: center; }\n  </style>\n</head>\n<body class=\"homey-widget\">\n  <div id=\"root\" aria-live=\"polite\"></div>\n\n  <script type=\"text/javascript\">\n    const NS = 'http://www.w3.org/2000/svg';\n\n    const TEXT = {\n      en: {\n        names: {\n          grid_charge: 'Grid charging', save: 'Saving for later', battery: 'Battery powers house',\n          solar_charge: 'Solar charging', solar_house: 'Solar powers house', at_reserve: 'At reserve · grid powers house', full: 'Full · solar powers tladdning', save: 'Sparar till senare', battery: 'Batteriet driver huset',\n          solar_charge: 'Solladdning', solar_house: 'Solen driver huset', at_reserve: 'Vid reserv · nätet driver huset', full: 'Fullt · solen driver huset',\n        },\n        bands: { grid_charge: 'Nät', save: 'Spara', battery: 'Batteri', solar_charge: 'Sol', solar_house: 'Solel', at_reserve: 'Reserv', full: 'Fullt' },\n        titles: {\n          grid_charge: 'Laddar från nätet', save: 'Sparar batteriet till senare', battery: 'Batteriet driver huset',\n          solar_charge: 'Solen laddar batteriet', solar_house: 'Solen driver huset', at_reserve: 'Batteriet vid reserv', full: 'Batteriet fullt',\n        },\n        subs: {\n          grid_charge: (u, soc) => `till ${u} · upp till ${soc} %`, save: (u) => `till ${u} · nätet driver huset`,\n          battery: (u, soc) => `till ${u} · ner till ${soc} %`, solar_charge: (u, soc) => `till ${u} · upp till ${soc} %`,\n          solar_house: (u) => `till ${u} · batteriet vilar`,\n          at_reserve: (u) => `till ${u} · nätet driver huset`, full: (u) => `till ${u} · solen driver huset`,\n        },\n        quiet: 'Batteriet vilar',\n        nowSub: 'just nu, avviker från prognosen',\n        monitor: 'Endast övervakning – appen styr inte växelriktaren',\n        locked: 'Batteriet låst av SolisCloud – frigör med Snabbkontroll → Urladdning (kort tid)',\n        outage: (until) => `Förbereder för strömavbrott till ${until}`,\n        price: () => `Pris ${cur()}/kWh`, energy: 'Sol & förbrukning kW', battery: 'Batteri %',\n        solar: 'Sol', load: 'Förbrukning', reserve: 'Reserv', now: 'Nu',\n        next24: 'Kommande 24 timmar', socEnd: 'Batteri vid slutet', nowRow: 'nu',\n        actual: 'Utfall', planned: 'planerat i morse', plannedLegend: 'Batteriet enligt morgonens plan',\n        saves: (amount) => `≈ <b>${amount} ${cur()}</b> billigare än vanlig egenanvändning`,\n        updated: (t) => `Uppdaterad ${t}`,\n        waiting: 'Väntar på den första planen…', notPaired: 'Lägg till din växelriktare i Homey för att se planen.',\n        today: 'Idag', tomorrow: 'Imorgon', soc: 'laddat',\n      },\n    };\n\n    // Icons after Lucide (ISC licence), the same set as the Battery status widget.\n    const SHIELD = '<path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/>';\n    const SUN = '<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41\"/>';\n    const ICON = {\n      grid_charge: '<path d=\"M12 2v20M2 5h20M3 3v2M7 3v2M17 3v2M21 3v2M19 5l-7 7-7-7\"/>',\n      save: '<rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/>',\n      battery: '<path d=\"M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8\"/><path d=\"M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/>',\n      solar_charge: SUN,\n      solar_house: SUN,\n      at_reserve: SHIELD,\n      full: '<rect x=\"2\" y=\"6\" width=\"16\" height=\"12\" rx=\"2\"/><path d=\"M22 14v-4M6 10v4M10 10v4M14 10v4\"/>',\n      warning: '<path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/>',\n      shield: SHIELD,\n      eye: '<path d=\"M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>',\n    };\n    const icon = (name, color) =>\n      `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"${color || 'currentColor'}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${ICON[name]}</svg>`;\n\n    const STATE_COLOR = {\n      grid_charge: 'var(--c-charge)', save: 'var(--c-hold)', battery: 'var(--c-use)',\n      solar_charge: 'var(--c-solar)', solar_house: 'var(--c-quiet)', at_reserve: 'var(--c-quiet)', full: 'var(--c-quiet)',\n    };\n    const QUIET = new Set(['solar_house', 'at_reserve', 'full']);\n\n    let view = null;\n    /** Short currency sign for the price area's currency (kr for SEK, NOK, DKK). */\n    const cur = () => ({ SEK: 'kr', NOK: 'kr', DKK: 'kr', EUR: '€', PLN: 'zł' })[view && view.currency] || (view && view.currency) || 'kr';\n    let hoursShown = 36;\n    let showEnergy = true;\n    let pastHours = 6;\n    let cursor = null; // index of interval under the crosshair\n\n    function t() { return TEXT[view && view.language === 'sv' ? 'sv' : 'en']; }\n\n    function el(name, attrs, text) {\n      const node = document.createElementNS(NS, name);\n      for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);\n      if (text !== undefined) node.textContent = text;\n      return node;\n    }\n\n    function fmtTime(iso) {\n      return new Date(iso).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: view.timeZone });\n    }\n    function fmtDay(iso) {\n      return new Date(iso).toLocaleDateString('sv-SE', { timeZone: view.timeZone });\n    }\n    function fmtNum(v, d) {\n      return Number(v).toLocaleString(view.language === 'sv' ? 'sv-SE' : 'en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });\n    }\n    function nowMs() { return view.mockNow ? new Date(view.mockNow).getTime() : Date.now(); }\n\n    function visibleIntervals() {\n      const end = nowMs() + hoursShown * 3600e3;\n      return view.plan.intervals.filter((iv) => new Date(iv.t).getTime() < end);\n    }\n\n    /** Measured quarters before the plan starts, as chart intervals marked `past`. */\n    function pastIntervals(future) {\n      if (!pastHours || !view.plan.past || future.length === 0) return [];\n      const from = nowMs() - pastHours * 3600e3;\n      const first = new Date(future[0].t).getTime();\n      return view.plan.past\n        .filter((q) => { const t = new Date(q.t).getTime(); return t >= from && t < first; })\n        .map((q) => ({ t: q.t, price: q.price === null ? NaN : q.price, pvKw: q.pvKw, loadKw: q.loadKw, soc: q.soc, plannedSoc: q.plannedSoc, past: true }));\n    }\n\n    /** The app's periods within the visible intervals, with interval indexes for drawing. */\n    function periods(intervals) {\n      const t0 = new Date(intervals[0].t).getTime();\n      const n = intervals.length;\n      return (view.plan.periods || [])\n        .map((p) => ({ ...p, from: Math.round((new Date(p.start).getTime() - t0) / 900e3), to: Math.round((new Date(p.end).getTime() - t0) / 900e3) - 1 }))\n        .filter((p) => p.to >= 0 && p.from < n)\n        .map((p) => ({ ...p, from: Math.max(0, p.from), to: Math.min(n - 1, p.to) }));\n    }\n\n    function renderHeader(root, intervals) {\n      const T = t();\n      const current = intervals[0];\n      const first = periods(intervals)[0];\n      const planned = first ? first.state : current.state;\n      // Live data wins over the forecast in self-use periods (e.g. a sunnier morning than expected).\n      const state = view.plan.nowState || planned;\n      const sub = view.plan.nowState ? T.nowSub : first ? T.subs[state](fmtTime(first.end), Math.round(first.socEnd)) : '';\n      const soc = view.live ? view.live.socPct : Math.round(current.soc);\n      const header = document.createElement('div');\n      header.className = 'status';\n      header.innerHTML = `\n        <div class=\"status-icon\">${icon(state)}</div>\n        <div class=\"status-text\"><div class=\"status-title\"></div><div class=\"status-sub\"></div></div>\n        <div class=\"soc\"><div class=\"soc-value\">${soc}<small>%</small></div><div class=\"soc-label\">${T.soc}</div></div>`;\n      header.querySelector('.status-icon').style.setProperty('--c', STATE_COLOR[state]);\n      header.querySelector('.status-title').textContent = T.titles[state];\n      header.querySelector('.status-sub').textContent = sub;\n      root.appendChild(header);\n\n      if (view.batteryLocked) {\n        const pill = document.createElement('div');\n        pill.className = 'pill warning';\n        pill.innerHTML = icon('warning');\n        pill.appendChild(document.createTextNode(T.locked));\n        root.appendChild(pill);\n      }\n      for (const w of view.warnings || []) {\n        const pill = document.createElement('div');\n        pill.className = 'pill warning';\n        pill.innerHTML = icon('warning');\n        pill.appendChild(document.createTextNode(`${w.title} · ${w.area}`));\n        root.appendChild(pill);\n      }\n      if (view.outageUntil) {\n        const pill = document.createElement('div');\n        pill.className = 'pill';\n        pill.innerHTML = icon('shield');\n        pill.appendChild(document.createTextNode(T.outage(`${fmtTime(view.outageUntil)}`)));\n        root.appendChild(pill);\n      }\n      if (view.controlMode !== 'auto') {\n        const pill = document.createElement('div');\n        pill.className = 'pill';\n        pill.innerHTML = icon('eye');\n        pill.appendChild(document.createTextNode(T.monitor));\n        root.appendChild(pill);\n      }\n    }\n\n    function niceDomain(min, max, steps) {\n      const span = Math.max(max - min, 0.1);\n      const raw = span / steps;\n      const mag = Math.pow(10, Math.floor(Math.log10(raw)));\n      const step = [1, 2, 5, 10].map((m) => m * mag).find((s) => s >= raw);\n      return { lo: Math.floor(min / step) * step, hi: Math.ceil(max / step) * step, step };\n    }\n\n    function renderChart(root, intervals, pastCount = 0) {\n      const T = t();\n      const wrap = document.createElement('div');\n      wrap.className = 'chart';\n      wrap.tabIndex = 0;\n      wrap.setAttribute('role', 'img');\n      root.appendChild(wrap);\n\n      const W = Math.max(wrap.clientWidth, 260);\n      const LEFT = 30, RIGHT = 4;\n      const plotW = W - LEFT - RIGHT;\n      const TITLE = 24, GAP = 8;\n      const panels = [{ key: 'price', h: 86 }];\n      if (showEnergy) panels.push({ key: 'energy', h: 58 });\n      panels.push({ key: 'battery', h: 52 });\n      let y = 0;\n      for (const p of panels) { p.top = y + TITLE; p.bottom = p.top + p.h; y = p.bottom + GAP; }\n      const H = y - GAP + 18;\n\n      const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H });\n      wrap.appendChild(svg);\n      const n = intervals.length;\n      const x = (i) => LEFT + (i / n) * plotW;\n      const start = new Date(intervals[0].t).getTime();\n\n      // Action washes across all panels, a solid strip on top of the price panel, and direct labels.\n      const top = panels[0].top, bottom = panels[panels.length - 1].bottom;\n      if (pastCount > 0) {\n        // What already happened: a neutral wash, labelled, left of the plan.\n        svg.appendChild(el('rect', { x: x(0), y: top, width: x(pastCount) - x(0), height: bottom - top, fill: 'var(--c-muted)', opacity: 0.08 }));\n        svg.appendChild(el('rect', { x: x(0), y: top, width: Math.max(x(pastCount) - x(0) - 2, 1), height: 3, rx: 1.5, fill: 'var(--c-muted)', opacity: 0.5 }));\n        if (x(pastCount) - x(0) > T.actual.length * 5.6 + 6) svg.appendChild(el('text', { x: x(0) + 4, y: top + 14, class: 'band-label quiet' }, T.actual));\n      }\n      for (const b of periods(intervals)) {\n        const x0 = x(b.from), x1 = x(b.to + 1);\n        const quiet = QUIET.has(b.state);\n        if (!quiet) {\n          svg.appendChild(el('rect', { x: x0, y: top, width: Math.max(x1 - x0, 1), height: bottom - top, fill: STATE_COLOR[b.state], style: 'opacity: var(--wash)' }));\n        }\n        svg.appendChild(el('rect', { x: x0, y: top, width: Math.max(x1 - x0 - 2, 1), height: 4, rx: 2, fill: STATE_COLOR[b.state], opacity: quiet ? 0.5 : 1 }));\n        const label = T.bands[b.state];\n        if (x1 - x0 > label.length * 5.4 + 6) { // ~5.4 px per character at 10 px\n          svg.appendChild(el('text', { x: x0 + 4, y: top + 15, class: quiet ? 'band-label quiet' : 'band-label', fill: STATE_COLOR[b.state] }, label));\n        }\n      }\n\n      for (const p of panels) {\n        let values, series;\n        if (p.key === 'price') {\n          values = intervals.map((iv) => iv.price).filter(Number.isFinite);\n          p.dom = niceDomain(Math.min(...values), Math.max(...values), 2);\n          p.title = T.price();\n        } else if (p.key === 'energy') {\n          const maxKw = Math.max(1, ...intervals.map((iv) => Math.max(iv.pvKw, iv.loadKw)));\n          p.dom = niceDomain(0, maxKw, 3);\n          p.title = T.energy;\n        } else {\n          p.dom = { lo: 0, hi: 100, step: 50 };\n          p.title = `${T.battery} · ${T.reserve.toLowerCase()} ${view.plan.reserveSoc} %`;\n        }\n        p.y = (v) => p.bottom - ((v - p.dom.lo) / (p.dom.hi - p.dom.lo)) * p.h;\n\n        svg.appendChild(el('text', { x: 0, y: p.top - 12, class: 'panel-title' }, p.title));\n        for (let v = p.dom.lo; v <= p.dom.hi + 1e-9; v += p.dom.step) {\n          const yy = p.y(v);\n          svg.appendChild(el('line', { x1: LEFT, x2: W - RIGHT, y1: yy, y2: yy, stroke: 'var(--c-grid)', 'stroke-width': 1 }));\n          svg.appendChild(el('text', { x: LEFT - 5, y: yy + 3, 'text-anchor': 'end', class: 'axis-text' }, fmtNum(v, p.dom.step < 1 ? 1 : 0)));\n        }\n\n        if (p.key === 'price') {\n          let d = '';\n          let drawing = false;\n          intervals.forEach((iv, i) => {\n            if (!Number.isFinite(iv.price)) { drawing = false; return; } // no recorded price\n            d += `${drawing ? 'L' : 'M'}${x(i)},${p.y(iv.price)}H${x(i + 1)}`;\n            drawing = true;\n          });\n          svg.appendChild(el('path', { d, fill: 'none', stroke: 'var(--c-price)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));\n        } else if (p.key === 'energy') {\n          let area = `M${x(0)},${p.y(0)}`;\n          intervals.forEach((iv, i) => { area += `L${x(i + 0.5)},${p.y(iv.pvKw)}`; });\n          area += `L${x(n)},${p.y(0)}Z`;\n          svg.appendChild(el('path', { d: area, fill: 'var(--c-solar)', opacity: 0.18 }));\n          const pv = intervals.map((iv, i) => `${i ? 'L' : 'M'}${x(i + 0.5)},${p.y(iv.pvKw)}`).join('');\n          svg.appendChild(el('path', { d: pv, fill: 'none', stroke: 'var(--c-solar)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));\n          const load = intervals.map((iv, i) => `${i ? 'L' : 'M'}${x(i + 0.5)},${p.y(iv.loadKw)}`).join('');\n          svg.appendChild(el('path', { d: load, fill: 'none', stroke: 'var(--c-muted)', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }));\n        } else {\n          const ry = p.y(view.plan.reserveSoc);\n          svg.appendChild(el('line', { x1: LEFT, x2: W - RIGHT, y1: ry, y2: ry, stroke: 'var(--c-muted)', 'stroke-width': 1, 'stroke-dasharray': '4 3' }));\n          let area = `M${x(0)},${p.y(0)}`;\n          const line = intervals.map((iv, i) => `${i ? 'L' : 'M'}${x(i + 1)},${p.y(iv.soc)}`).join('');\n          intervals.forEach((iv, i) => { area += `L${x(i + 1)},${p.y(iv.soc)}`; });\n          area += `L${x(n)},${p.y(0)}Z`;\n          svg.appendChild(el('path', { d: area, fill: 'var(--c-use)', opacity: 0.16 }));\n          svg.appendChild(el('path', { d: line, fill: 'none', stroke: 'var(--c-use)', 'stroke-width': 2.25, 'stroke-linejoin': 'round' }));\n          // Plan vs actual: what the day's first plan expected, dashed, over the measured line.\n          let planned = '';\n          let open = false;\n          for (let i = 0; i < pastCount; i++) {\n            const v = intervals[i].plannedSoc;\n            if (v === null || v === undefined) { open = false; continue; }\n            planned += `${open ? 'L' : 'M'}${x(i + 1)},${p.y(v)}`;\n            open = true;\n          }\n          if (planned) svg.appendChild(el('path', { d: planned, fill: 'none', stroke: 'var(--c-ink)', 'stroke-width': 1.5, 'stroke-dasharray': '4 3', opacity: 0.6 }));\n          if (view.live) {\n            // Current state of charge as an end-dot at the start of the forecast.\n            svg.appendChild(el('circle', { cx: x(pastCount), cy: p.y(view.live.socPct), r: 4.5, fill: 'var(--c-use)', stroke: 'var(--c-surface)', 'stroke-width': 2 }));\n          }\n        }\n      }\n\n      // Time axis: every 3 hours on the hour (6 when narrow), day name at midnight; keep clear of \"Now\".\n      const today = fmtDay(new Date(nowMs()).toISOString());\n      const nowX = x((nowMs() - start) / 900e3);\n      const every = plotW / n * 12 < 34 ? 6 : 3;\n      intervals.forEach((iv, i) => {\n        const hhmm = fmtTime(iv.t);\n        if (!hhmm.endsWith(':00') || Number(hhmm.slice(0, 2)) % every !== 0 || i === 0) return;\n        if (Math.abs(x(i) - nowX) < 30) return;\n        const midnight = hhmm === '00:00';\n        const label = midnight ? (fmtDay(iv.t) === today ? T.today : T.tomorrow) : hhmm.slice(0, 2);\n        if (midnight) svg.appendChild(el('line', { x1: x(i), x2: x(i), y1: top, y2: bottom, stroke: 'var(--c-grid)', 'stroke-width': 1 }));\n        svg.appendChild(el('text', { x: x(i), y: bottom + 13, 'text-anchor': 'middle', class: 'axis-text', 'font-weight': midnight ? 600 : 400 }, label));\n      });\n\n      // \"Now\" marker at the left edge of the current interval.\n      if (nowX >= LEFT && nowX <= W) {\n        // One segment per panel, so the line does not run through the panel titles.\n        for (const p of panels) {\n          svg.appendChild(el('line', { x1: nowX, x2: nowX, y1: p === panels[0] ? top - 2 : p.top, y2: p.bottom, stroke: 'var(--c-ink)', 'stroke-width': 1 }));\n        }\n        svg.appendChild(el('text', { x: nowX, y: bottom + 13, 'text-anchor': 'middle', class: 'axis-text', 'font-weight': 600 }, T.now));\n      }\n\n      // Crosshair + tooltip: pointer, touch and keyboard.\n      const hair = el('line', { y1: top - 2, y2: bottom, stroke: 'var(--c-ink)', 'stroke-width': 1, opacity: 0.5, visibility: 'hidden' });\n      svg.appendChild(hair);\n      const dots = panels.filter((p) => p.key !== 'energy').map((p) => {\n        const c = el('circle', { r: 4, fill: 'var(--c-ink)', stroke: 'var(--c-surface)', 'stroke-width': 2, visibility: 'hidden' });\n        svg.appendChild(c);\n        return { p, c };\n      });\n      const tip = document.createElement('div');\n      tip.className = 'tooltip';\n      wrap.appendChild(tip);\n\n      function show(i) {\n        cursor = Math.max(0, Math.min(n - 1, i));\n        const iv = intervals[cursor];\n        const cx = x(cursor + 0.5);\n        hair.setAttribute('x1', cx); hair.setAttribute('x2', cx); hair.setAttribute('visibility', 'visible');\n        for (const { p, c } of dots) {\n          c.setAttribute('cx', p.key === 'battery' ? x(cursor + 1) : cx);\n          c.setAttribute('cy', p.key === 'price' ? p.y(Number.isFinite(iv.price) ? iv.price : p.dom.lo) : p.y(iv.soc));\n          c.setAttribute('visibility', 'visible');\n        }\n        tip.replaceChildren();\n        const time = document.createElement('div');\n        time.className = 'tt-time';\n        const day = fmtDay(iv.t) === fmtDay(new Date(nowMs()).toISOString()) ? '' : `${t().tomorrow} `;\n        time.textContent = `${day}${fmtTime(iv.t)}–${fmtTime(new Date(new Date(iv.t).getTime() + 900e3).toISOString())}`;\n        tip.appendChild(time);\n        const row = (key, value, label) => {\n          const r = document.createElement('div');\n          r.className = 'tt-row';\n          const k = document.createElement('span'); k.className = 'key'; k.style.background = key; r.appendChild(k);\n          const b = document.createElement('b'); b.textContent = value; r.appendChild(b);\n          const l = document.createElement('span'); l.className = 'l'; l.textContent = label; r.appendChild(l);\n          tip.appendChild(r);\n        };\n        if (Number.isFinite(iv.price)) row('var(--c-price)', `${fmtNum(iv.price, 2)} ${cur()}`, '/kWh');\n        if (iv.past) row('var(--c-muted)', T.actual, '');\n        else row(STATE_COLOR[iv.state], T.names[iv.state], '');\n        if (showEnergy) {\n          row('var(--c-solar)', `${fmtNum(iv.pvKw, 1)} kW`, T.solar);\n          row('var(--c-muted)', `${fmtNum(iv.loadKw, 1)} kW`, T.load);\n        }\n        row('var(--c-use)', `${Math.round(iv.soc)} %`, T.battery.replace(' %', ''));\n        if (iv.past && iv.plannedSoc !== null && iv.plannedSoc !== undefined) row('transparent', `${Math.round(iv.plannedSoc)} %`, T.planned);\n        tip.classList.add('visible');\n        const tw = tip.offsetWidth;\n        tip.style.left = `${cx + 12 + tw > W ? cx - tw - 12 : cx + 12}px`;\n        tip.style.top = `${panels[0].top}px`;\n      }\n      function hide() {\n        cursor = null;\n        hair.setAttribute('visibility', 'hidden');\n        for (const { c } of dots) c.setAttribute('visibility', 'hidden');\n        tip.classList.remove('visible');\n      }\n      const indexAt = (clientX) => Math.floor(((clientX - wrap.getBoundingClientRect().left - LEFT) / plotW) * n);\n      wrap.addEventListener('pointermove', (e) => show(indexAt(e.clientX)));\n      wrap.addEventListener('pointerdown', (e) => show(indexAt(e.clientX)));\n      wrap.addEventListener('pointerleave', hide);\n      wrap.addEventListener('blur', hide);\n      wrap.addEventListener('keydown', (e) => {\n        if (e.key === 'ArrowRight') show((cursor ?? -1) + 1);\n        else if (e.key === 'ArrowLeft') show((cursor ?? 1) - 1);\n        else if (e.key === 'Escape') hide();\n        else return;\n        e.preventDefault();\n      });\n      wrap.setAttribute('aria-label', `${T.price()}, ${T.energy}, ${T.battery}`);\n\n      // The coloured periods are named in the chart and in the list below; the legend covers the lines.\n      const legend = document.createElement('div');\n      legend.className = 'legend';\n      const item = (html) => { const s = document.createElement('span'); s.innerHTML = html; legend.appendChild(s); };\n      item(`<i class=\"key\" style=\"background:var(--c-price)\"></i>${T.price()}`);\n      item(`<i class=\"key\" style=\"background:var(--c-use)\"></i>${T.battery}`);\n      if (showEnergy) {\n        item(`<i class=\"key\" style=\"background:var(--c-solar)\"></i>${T.solar}`);\n        item(`<i class=\"key\" style=\"background:var(--c-muted)\"></i>${T.load}`);\n      }\n      if (pastCount > 0) item(`<i class=\"key dashed\"></i>${T.plannedLegend}`);\n      root.appendChild(legend);\n    }\n\n    function renderSchedule(root, intervals) {\n      const T = t();\n      const section = document.createElement('div');\n      section.className = 'schedule';\n      const h = document.createElement('h3');\n      h.innerHTML = '<span></span><span class=\"col\"></span>';\n      h.firstChild.textContent = T.next24;\n      h.lastChild.textContent = T.socEnd;\n      section.appendChild(h);\n      const addRow = (state, when, soc) => {\n        const row = document.createElement('div');\n        row.className = 'row';\n        row.innerHTML = `<span class=\"badge\">${icon(state)}</span><span class=\"what\"></span><span class=\"when\"></span><span class=\"target\"></span>`;\n        row.querySelector('.badge').style.setProperty('--c', STATE_COLOR[state]);\n        row.querySelector('.what').textContent = T.names[state];\n        row.querySelector('.when').textContent = when;\n        row.querySelector('.target').textContent = `${soc} %`;\n        section.appendChild(row);\n      };\n      // What really happens now comes first when it differs from the plan (e.g. more sun than forecast).\n      if (view.plan.nowState && view.live) addRow(view.plan.nowState, T.nowRow, Math.round(view.live.socPct));\n      const horizon = nowMs() + 24 * 3600e3;\n      const upcoming = periods(intervals).filter((p) => new Date(p.start).getTime() < horizon).slice(0, 8);\n      const today = fmtDay(new Date(nowMs()).toISOString());\n      let dayShown = today;\n      for (const p of upcoming) {\n        const from = new Date(Math.max(new Date(p.start).getTime(), nowMs())).toISOString();\n        if (fmtDay(from) !== dayShown) {\n          // One heading where tomorrow starts, instead of repeating the day on every row.\n          dayShown = fmtDay(from);\n          const day = document.createElement('div');\n          day.className = 'day';\n          day.textContent = T.tomorrow;\n          section.appendChild(day);\n        }\n        addRow(p.state, `${fmtTime(from)}–${fmtTime(p.end)}`, p.socEnd);\n      }\n      root.appendChild(section);\n    }\n\n    function render() {\n      setTimeout(() => window.dispatchEvent(new Event('rendered')), 0);\n      const root = document.getElementById('root');\n      root.replaceChildren();\n      root.classList.remove('refreshing');\n      if (!view || !view.ready || !view.plan) {\n        const msg = document.createElement('div');\n        msg.className = 'message';\n        msg.textContent = view && view.paired === false ? t().notPaired : t().waiting;\n        root.appendChild(msg);\n        return;\n      }\n      const intervals = visibleIntervals();\n      const past = pastIntervals(intervals);\n      renderHeader(root, intervals);\n      renderChart(root, [...past, ...intervals], past.length);\n      renderSchedule(root, intervals);\n      const footer = document.createElement('div');\n      footer.className = 'footer';\n      const left = document.createElement('span');\n      left.className = 'saves';\n      left.innerHTML = t().saves(fmtNum(view.plan.savingsSek, 0));\n      const right = document.createElement('span');\n      right.textContent = t().updated(fmtTime(view.plan.generatedAt));\n      footer.append(left, right);\n      root.appendChild(footer);\n    }\n\n    function onHomeyReady(Homey) {\n      const settings = Homey.getSettings() || {};\n      hoursShown = Number(settings.hours) || 36;\n      showEnergy = settings.showEnergy !== false;\n      pastHours = settings.past === undefined ? 6 : Number(settings.past) || 0;\n      const load = () => {\n        document.getElementById('root').classList.add('refreshing');\n        return Homey.api('GET', '/', {}).then((v) => { view = v; render(); }).catch((err) => {\n          document.getElementById('root').classList.remove('refreshing');\n          console.error(err);\n        });\n      };\n      const fit = () => {\n        const height = Math.ceil(document.body.scrollHeight);\n        if (height !== lastHeight) {\n          lastHeight = height;\n          Homey.setHeight(height);\n        }\n      };\n      let lastHeight = 0;\n      window.addEventListener('rendered', fit);\n      load().finally(() => {\n        lastHeight = Math.ceil(document.body.scrollHeight);\n        Homey.ready({ height: lastHeight });\n      });\n      Homey.on('plan', load);\n      Homey.on('live', load);\n      setInterval(load, 10 * 60e3);\n      let width = document.body.clientWidth;\n      window.addEventListener('resize', () => { if (document.body.clientWidth !== width) { width = document.body.clientWidth; render(); } });\n    }\n  <\/script>\n</body>\n</html>\n"};
    const TEXT = {
      en: {
        title: 'Home Battery Planner', updated: (t) => `Updated ${t}`, offline: 'Cannot reach Homey: ',
        setupTitle: 'Connect to Homey',
        setupText: 'This page reads the values straight from Homey on your home network, with a Homey API key. Create one in the Homey web app: Settings → API Keys → New API Key, with only “Devices: read only”.',
        noDevice: 'no Home Battery Planner device found with this key', noData: 'no dashboard data yet – wait a few minutes',
        address: "Homey's address on your network", apiKey: 'Homey API key', save: 'Connect',
        setupNote: 'The address and key are stored in this browser only and are sent to nothing but your Homey.',
        forget: 'Forget the key on this device',
      },
      sv: {
        title: 'Hembatteriplanerare', updated: (t) => `Uppdaterad ${t}`, offline: 'Når inte Homey: ',
        setupTitle: 'Anslut till Homey',
        setupText: 'Sidan läser värdena direkt från Homey i ditt hemnätverk, med en API-nyckel för Homey. Skapa en i Homeys webbapp: Inställningar → API-nycklar → Ny API-nyckel, med bara ”Enheter: endast läsa”.',
        noDevice: 'ingen Hembatteriplanerare-enhet hittades med den här nyckeln', noData: 'ingen data för panelen ännu – vänta några minuter',
        address: 'Homeys adress i nätverket', apiKey: 'API-nyckel för Homey', save: 'Anslut',
        setupNote: 'Adressen och nyckeln sparas bara i den här webbläsaren och skickas inte till något annat än din Homey.',
        forget: 'Glöm nyckeln på den här enheten',
      },
    };
    let language = (navigator.language || 'en').startsWith('sv') ? 'sv' : 'en';
    const t = () => TEXT[language];

    // Theme: ?theme=dark|light in the link, otherwise the device setting.
    const params = new URLSearchParams(location.hash.slice(1));
    const theme = params.get('theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
    const isDark = () => theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);

    let source = null; // () => Promise<view>
    let latest = null;
    let pending = null;
    const listeners = [];

    function load() {
      if (!pending) {
        pending = source().then((view) => {
          latest = view;
          pending = null;
          showError(null);
          if (view && view.language) language = view.language === 'sv' ? 'sv' : 'en';
          applyTexts();
          const at = view && view.live && view.live.at;
          document.getElementById('updated').textContent = at
            ? t().updated(new Date(at).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: view.timeZone })) : '';
          return view;
        }, (err) => {
          pending = null;
          showError(t().offline + (err && err.message ? err.message : String(err)));
          if (latest) return latest;
          throw err;
        });
      }
      return pending;
    }

    let mounted = false;

    function refresh() {
      load().then(() => {
        if (!mounted) showWidgets();
        listeners.forEach((cb) => cb());
      }).catch(() => undefined);
    }

    /** The widgets appear once there is data, so a wrong key shows only the error. */
    function showWidgets() {
      mounted = true;
      document.getElementById('widgets').hidden = false;
      for (const frame of document.querySelectorAll('iframe[data-widget]')) mount(frame);
    }

    function showError(text) {
      const box = document.getElementById('error');
      box.hidden = !text;
      box.textContent = text || '';
    }

    function applyTexts() {
      document.getElementById('title').textContent = t().title;
      document.documentElement.lang = language;
      for (const el of document.querySelectorAll('[data-t]')) el.textContent = t()[el.dataset.t];
    }

    /** Homey's widget look: the variables the widgets use. */
    function widgetStyle() {
      const dark = isDark();
      return `:root{--homey-background-color:${dark ? '#1c1c1e' : '#ffffff'};--homey-text-color:${dark ? '#f2f2f7' : '#1c1c1e'};`
        + `--homey-text-color-light:${dark ? '#98989f' : '#8a8a8e'};--homey-color-warning:#fab219;--homey-color-danger:#f44336;`
        + `--homey-color-highlight:${dark ? '#0a84ff' : '#007aff'};--homey-su-2:8px;--homey-su-3:12px;--homey-su-4:16px}`
        + `html,body{background:var(--homey-background-color)}body{margin:0;padding:16px}`;
    }

    /** Runs a widget file in its frame, with this page standing in for Homey's widget runtime. */
    function mount(frame) {
      frame.addEventListener('load', () => {
        const doc = frame.contentDocument;
        const style = doc.createElement('style');
        style.textContent = widgetStyle();
        doc.head.appendChild(style);
        doc.body.classList.toggle('homey-dark-mode', isDark());
        frame.contentWindow.onHomeyReady({
          getSettings: () => ({ hours: frame.dataset.hours || '36', showEnergy: true }),
          api: () => load(),
          on: (_event, cb) => { listeners.push(cb); },
          ready: (opts) => { if (opts && opts.height) frame.style.height = `${Math.ceil(opts.height) + 2}px`; },
          setHeight: (h) => { frame.style.height = `${Math.ceil(h) + 2}px`; },
          __: (key) => key,
        });
      });
      frame.srcdoc = WIDGETS[frame.dataset.widget];
    }

    function start() {
      refresh();
      setInterval(refresh, 60_000);
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => location.reload());
    }

    // --- inside Homey (the app's settings page): data through the logged-in Homey API
    window.onHomeyReady = (Homey) => {
      const api = (method, path, body) => new Promise((resolve, reject) => {
        Homey.api(method, path, body, (err, result) => (err ? reject(err) : resolve(result)));
      });
      source = () => api('GET', '/view');
      Homey.on('live', refresh);
      Homey.on('plan', refresh);
      start();
      Homey.ready();
    };

    // --- on its own (a browser or wall screen at home)
    // Data straight from Homey's local API with a Homey API key: nothing public, nothing via the internet.
    // The address and key live in this browser's storage only, never in the link.
    const STORE = 'solis-dashboard';
    const ADDRESS_STORE = 'solis-dashboard-address'; // kept after "Forget the key", so it need not be typed again
    const stored = () => {
      try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { return null; }
    };
    /** "192.168.1.20" → Homey's local HTTPS name, which has a valid certificate. */
    const homeyBase = (address) => {
      const a = address.trim().replace(/\/+$/, '');
      if (/^https?:\/\//.test(a)) return a;
      return /^\d+\.\d+\.\d+\.\d+$/.test(a) ? `https://${a.replace(/\./g, '-')}.homey.homeylocal.com` : `http://${a}`;
    };
    /**
     * The app publishes the dashboard's data as a hidden value on its device, so a key that may only
     * read devices ("Devices: read only") is enough: no access to apps, settings or control.
     */
    function connect(config) {
      const get = (path) => fetch(`${homeyBase(config.address)}/api/manager/devices/${path}`, {
        cache: 'no-store', headers: { Authorization: `Bearer ${config.key}` },
      }).then((r) => r.json().catch(() => ({})).then((body) => {
        if (!r.ok) throw new Error(body && body.error ? body.error : `HTTP ${r.status}`);
        return body;
      }));
      const findDevice = () => get('device/').then((devices) => {
        const found = Object.values(devices).find((d) => d.capabilitiesObj && d.capabilitiesObj.solis_dashboard);
        if (!found) throw new Error(t().noDevice);
        config.device = found.id;
        try { localStorage.setItem(STORE, JSON.stringify(config)); } catch { /* storage blocked */ }
        return found;
      });
      const device = () => (config.device ? get(`device/${config.device}`).catch(findDevice) : findDevice());
      source = () => device().then((d) => {
        const value = d.capabilitiesObj.solis_dashboard && d.capabilitiesObj.solis_dashboard.value;
        if (!value) throw new Error(t().noData);
        return JSON.parse(value);
      });
      document.getElementById('forget-row').hidden = false;
      start();
    }
    document.getElementById('forget').addEventListener('click', () => {
      try { localStorage.removeItem(STORE); } catch { /* storage blocked */ }  // the address stays
      location.reload();
    });
    document.getElementById('setup').addEventListener('submit', (event) => {
      event.preventDefault();
      const config = { address: document.getElementById('address').value, key: document.getElementById('api-key').value.trim() };
      try {
        localStorage.setItem(STORE, JSON.stringify(config));
        localStorage.setItem(ADDRESS_STORE, config.address.trim());
      } catch { /* storage blocked: works until reload */ }
      document.getElementById('setup').hidden = true;
      connect(config);
    });
    // Inside Homey, the settings runtime calls onHomeyReady; elsewhere ask for the address and key once.
    setTimeout(() => {
      if (source) return;
      const config = stored();
      if (config && config.address && config.key) connect(config);
      else {
        let last = '';
        try { last = localStorage.getItem(ADDRESS_STORE) || (config && config.address) || ''; } catch { /* storage blocked */ }
        const address = document.getElementById('address');
        address.value = last;
        document.getElementById('setup').hidden = false;
        (last ? document.getElementById('api-key') : address).focus();
      }
    }, 800);
    applyTexts();
  </script>
