<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --c-battery: #2a78d6;
      --c-battery-track: #cde2fb;
      --c-solar: #eda100;
      --c-ink: var(--homey-text-color, #1a1a1a);
      --c-muted: var(--homey-text-color-light, #8a8a8e);
      --c-grid: rgba(0, 0, 0, 0.08);
      --c-surface: var(--homey-background-color, #fff);
      --c-node: rgba(0, 0, 0, 0.04);
    }
    .homey-dark-mode {
      --c-battery: #3987e5;
      --c-battery-track: #184f95;
      --c-solar: #c98500;
      --c-grid: rgba(255, 255, 255, 0.10);
      --c-node: rgba(255, 255, 255, 0.06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--c-ink); }
    #root { transition: opacity 0.2s; }
    #root.refreshing { opacity: 0.6; }

    .flow svg { display: block; width: 100%; height: auto; overflow: visible; }
    .node-bg { fill: var(--c-node); stroke: var(--c-grid); stroke-width: 1; }
    .node-icon { fill: none; stroke: var(--c-ink); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .value { font-size: 14px; font-weight: 600; fill: var(--c-ink); }
    .label { font-size: 11px; fill: var(--c-muted); }
    .line-base { stroke: var(--c-grid); stroke-width: 3; stroke-linecap: round; fill: none; }
    .line-flow { stroke-width: 3; stroke-linecap: round; fill: none; stroke-dasharray: 2 9; animation: flow linear infinite; }
    .line-flow.reverse { animation-direction: reverse; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @media (prefers-reduced-motion: reduce) { .line-flow { animation: none; stroke-dasharray: none; opacity: 0.8; } }

    .pill { display: flex; align-items: center; gap: 6px; margin-bottom: var(--homey-su-2, 8px); padding: 6px 10px; border-radius: 10px; font-size: 12px;
      background: color-mix(in srgb, var(--homey-color-warning, #fab219) 22%, transparent); }
    .pill svg { width: 16px; height: 16px; flex: none; }
    .pill.info { background: var(--c-node); color: var(--c-muted); }
    .pill.alert { font-weight: 600; background: color-mix(in srgb, var(--homey-color-danger, #f44336) 22%, transparent); }
    .tile.risk { box-shadow: inset 0 0 0 1.5px var(--homey-color-warning, #fab219); }

    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--homey-su-2, 8px); margin-top: var(--homey-su-3, 12px); }
    .tile { padding: 10px; border-radius: 12px; background: var(--c-node); min-width: 0; }
    .tile-label { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--c-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-label svg { width: 13px; height: 13px; flex: none; }
    .tile-value { margin-top: 4px; font-size: 18px; font-weight: 600; line-height: 1.1; }
    .tile-unit { font-size: 12px; font-weight: 400; color: var(--c-muted); }
    .source { margin-top: var(--homey-su-2, 8px); font-size: 13px; text-align: center; }
    .source b { font-weight: 600; }
    .source span { color: var(--c-muted); }
    .footer { margin-top: var(--homey-su-2, 8px); font-size: 11px; color: var(--c-muted); text-align: right; }
    .message { color: var(--c-muted); font-size: 13px; padding: var(--homey-su-4, 16px) 0; text-align: center; }
  </style>
</head>
<body class="homey-widget">
  <div id="root" aria-live="polite"></div>

  <script type="text/javascript">
    const NS = 'http://www.w3.org/2000/svg';
    const TEXT = {
      en: {
        solar: 'Solar', grid: 'Grid', house: 'House', battery: 'Battery',
        importing: 'import', exporting: 'export', charging: 'charging', discharging: 'discharging', idle: 'idle',
        backup: 'Backup time', reserve: 'Reserve', price: 'Price now', extra: 'Extra power now',
        poweredBy: 'House powered by', fromSolar: 'solar', fromBattery: 'battery', fromGrid: 'grid',
        locked: 'Battery locked by SolisCloud – release it with Quick Control → Discharge (short duration)',
        powerCut: (t) => `Power cut since ${t} – the battery powers the backup output`,
        exportPaused: 'Export paused – selling would cost money right now',
        savedMonth: 'Saved this month', savedToday: 'Saved today', peak: 'Power peak this month',
        updated: (t) => `Data from ${t}`, waiting: 'Waiting for data…', notPaired: 'Add your Solis inverter in Homey to see its status.',
      },
      sv: {
        solar: 'Sol', grid: 'Nät', house: 'Hus', battery: 'Batteri',
        importing: 'köp', exporting: 'sälj', charging: 'laddar', discharging: 'laddar ur', idle: 'vila',
        backup: 'Reservtid', reserve: 'Reserv', price: 'Pris nu', extra: 'Extra el nu',
        poweredBy: 'Huset drivs av', fromSolar: 'sol', fromBattery: 'batteri', fromGrid: 'nät',
        locked: 'Batteriet låst av SolisCloud – frigör med Snabbkontroll → Urladdning (kort tid)',
        powerCut: (t) => `Strömavbrott sedan ${t} – batteriet driver reservutgången`,
        exportPaused: 'Export pausad – det kostar att sälja just nu',
        savedMonth: 'Sparat denna månad', savedToday: 'Sparat i dag', peak: 'Effekttopp denna månad',
        updated: (t) => `Data från ${t}`, waiting: 'Väntar på data…', notPaired: 'Lägg till din Solis-växelriktare i Homey för att se status.',
      },
    };
    const PATHS = {
      solar: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
      grid: '<path d="M12 2l-5 20M12 2l5 20M8.6 15.5h6.8M9.6 11.5h4.8M5 7h14M8 20.5l7.3-5M16 20.5l-7.3-5"/>',
      house: '<path d="M3 11l9-7.5 9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
      battery: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M10 2h4M13 8l-2.5 4h3L11 16"/>',
      inverter: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h3M8 16h8"/><path d="M14 11.5c.7-1 1.3-1 2 0"/>',
      shield: '<path d="M12 21.5s7.5-3.2 7.5-9.5V5.5L12 2.5 4.5 5.5V12c0 6.3 7.5 9.5 7.5 9.5z"/>',
      tag: '<path d="M20.6 12.6l-8 8a1.4 1.4 0 01-2 0L3 13V3h10l7.6 7.6a1.4 1.4 0 010 2z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
      warning: '<path d="M10.3 3.7L2.4 17.5A2 2 0 004.1 20.5h15.8a2 2 0 001.7-3L13.7 3.7a2 2 0 00-3.4 0z"/><path d="M12 9v4.5M12 16.8v.1"/>',
      plugOff: '<path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 01-6 6 6 6 0 01-6-6z"/><path d="M12 17v5"/><path d="M3 3l18 18"/>',
      coins: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
      gauge: '<path d="M3.5 17a9 9 0 1117 0"/><path d="M12 13l4-5"/><circle cx="12" cy="13" r="1.2"/>',
    };
    const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]}</svg>`;

    let view = null;
    /** Short currency sign for the price area's currency (kr for SEK, NOK, DKK). */
    const cur = () => ({ SEK: 'kr', NOK: 'kr', DKK: 'kr', EUR: '€', PLN: 'zł' })[view && view.currency] || (view && view.currency) || 'kr';
    const T = () => TEXT[view && view.language === 'sv' ? 'sv' : 'en'];

    function el(name, attrs, text) {
      const node = document.createElementNS(NS, name);
      for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
      if (text !== undefined) node.textContent = text;
      return node;
    }
    const locale = () => (view.language === 'sv' ? 'sv-SE' : 'en-GB');
    function power(w) {
      const a = Math.abs(w || 0);
      return a < 1000 ? `${Math.round(a)} W` : `${(a / 1000).toLocaleString(locale(), { maximumFractionDigits: 1, minimumFractionDigits: 1 })} kW`;
    }
    function nowMs() { return view.mockNow ? new Date(view.mockNow).getTime() : Date.now(); }

    function renderFlow(root) {
      const t = T();
      const live = view.live;
      const W = 320, H = 236;
      const hub = { x: 160, y: 112 };
      const R = 24;
      const nodes = {
        solar: { x: 160, y: 30, w: live.pvW, color: 'var(--c-solar)', label: t.solar, towardHub: true, text: 'right' },
        grid: { x: 44, y: 112, w: live.gridW, color: 'var(--c-muted)', label: `${t.grid} · ${live.gridW >= 0 ? t.importing : t.exporting}`, towardHub: live.gridW >= 0, text: 'below' },
        house: { x: 276, y: 112, w: live.loadW, color: 'var(--c-ink)', label: t.house, towardHub: false, text: 'below' },
        battery: {
          x: 160, y: 194, w: live.batteryW, color: 'var(--c-battery)',
          label: `${t.battery} · ${live.batteryW > 30 ? t.charging : live.batteryW < -30 ? t.discharging : t.idle}`,
          towardHub: live.batteryW < 0, text: 'right',
        },
      };

      const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
      svg.setAttribute('aria-label', Object.values(nodes).map((n) => `${n.label} ${power(n.w)}`).join(', '));

      for (const n of Object.values(nodes)) {
        const dx = n.x - hub.x, dy = n.y - hub.y, len = Math.hypot(dx, dy);
        const ux = dx / len, uy = dy / len;
        const d = `M${hub.x + ux * 18},${hub.y + uy * 18}L${n.x - ux * (R + 4)},${n.y - uy * (R + 4)}`;
        svg.appendChild(el('path', { d, class: 'line-base' }));
        const active = Math.abs(n.w || 0) >= 30;
        if (active) {
          const seconds = Math.max(0.5, Math.min(3, 2.6 - Math.log10(Math.abs(n.w) / 100)));
          const flow = el('path', { d, class: `line-flow${n.towardHub ? ' reverse' : ''}`, stroke: n.color });
          flow.style.animationDuration = `${seconds.toFixed(2)}s`;
          svg.appendChild(flow);
        }
      }

      // Inverter hub.
      svg.appendChild(el('rect', { x: hub.x - 16, y: hub.y - 16, width: 32, height: 32, rx: 9, class: 'node-bg' }));
      const hubIcon = el('g', { transform: `translate(${hub.x - 10},${hub.y - 10}) scale(0.833)`, class: 'node-icon' });
      hubIcon.innerHTML = PATHS.inverter;
      svg.appendChild(hubIcon);

      for (const [key, n] of Object.entries(nodes)) {
        svg.appendChild(el('circle', { cx: n.x, cy: n.y, r: R, class: 'node-bg' }));
        if (key === 'battery') {
          // State-of-charge ring: same-hue track, fill proportional to SOC.
          const rr = R + 3.5, c = 2 * Math.PI * rr, soc = Math.max(0, Math.min(100, live.socPct || 0));
          svg.appendChild(el('circle', { cx: n.x, cy: n.y, r: rr, fill: 'none', stroke: 'var(--c-battery-track)', 'stroke-width': 4 }));
          svg.appendChild(el('circle', {
            cx: n.x, cy: n.y, r: rr, fill: 'none', stroke: 'var(--c-battery)', 'stroke-width': 4, 'stroke-linecap': 'round',
            'stroke-dasharray': `${(c * soc) / 100} ${c}`, transform: `rotate(-90 ${n.x} ${n.y})`,
          }));
        }
        const g = el('g', { transform: `translate(${n.x - 10},${n.y - 10}) scale(0.833)`, class: 'node-icon' });
        g.innerHTML = PATHS[key];
        svg.appendChild(g);

        const value = key === 'battery' ? `${live.socPct} % · ${power(n.w)}` : power(n.w);
        if (n.text === 'right') {
          svg.appendChild(el('text', { x: n.x + R + 12, y: n.y - 2, class: 'value' }, value));
          svg.appendChild(el('text', { x: n.x + R + 12, y: n.y + 13, class: 'label' }, n.label));
        } else {
          svg.appendChild(el('text', { x: n.x, y: n.y + R + 18, 'text-anchor': 'middle', class: 'value' }, value));
          svg.appendChild(el('text', { x: n.x, y: n.y + R + 32, 'text-anchor': 'middle', class: 'label' }, n.label));
        }
      }
      const wrap = document.createElement('div');
      wrap.className = 'flow';
      wrap.appendChild(svg);
      root.appendChild(wrap);
    }

    function tile(root, iconName, label, value, unit) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `<div class="tile-label">${icon(iconName)}<span></span></div><div class="tile-value"><span class="v"></span> <span class="tile-unit"></span></div>`;
      tile.querySelector('.tile-label span').textContent = label;
      tile.querySelector('.v').textContent = value;
      tile.querySelector('.tile-unit').textContent = unit;
      root.appendChild(tile);
      return tile;
    }

    function render() {
      setTimeout(() => window.dispatchEvent(new Event('rendered')), 0);
      const root = document.getElementById('root');
      root.replaceChildren();
      root.classList.remove('refreshing');
      const t = T();
      if (!view || !view.live) {
        const msg = document.createElement('div');
        msg.className = 'message';
        msg.textContent = view && view.paired === false ? t.notPaired : t.waiting;
        root.appendChild(msg);
        return;
      }
      const fmtTime = (iso) => new Date(iso).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: view.timeZone });
      const notices = (view.warnings || []).map((w) => ['warning', `${w.title} · ${w.area}`]);
      if (view.exportPaused) notices.push(['tag', t.exportPaused, 'info']);
      if (view.offPlan) notices.unshift(['warning', view.offPlan]);
      if (view.batteryLocked) notices.unshift(['warning', t.locked]);
      if (view.powerCut) notices.unshift(['plugOff', t.powerCut(fmtTime(view.powerCut.since)), 'alert']);
      for (const [name, text, kind] of notices) {
        const pill = document.createElement('div');
        pill.className = kind ? `pill ${kind}` : 'pill';
        pill.innerHTML = icon(name);
        pill.appendChild(document.createTextNode(text));
        root.appendChild(pill);
      }
      renderFlow(root);
      if (view.supply) {
        const s = view.supply;
        const line = document.createElement('div');
        line.className = 'source';
        const shares = [[s.solarPct, t.fromSolar], [s.batteryPct, t.fromBattery], [s.gridPct, t.fromGrid]]
          .filter(([pct]) => pct > 0).map(([pct, name]) => `${pct} % ${name}`).join(' · ');
        line.innerHTML = '<span></span> <b></b><br><span class="shares"></span>';
        line.querySelector('span').textContent = t.poweredBy;
        line.querySelector('b').textContent = s.title;
        line.querySelector('.shares').textContent = shares;
        root.appendChild(line);
      }

      const tiles = document.createElement('div');
      tiles.className = 'tiles';
      const hours = view.live.backupHours;
      tile(tiles, 'clock', t.backup, hours === null ? '–' : hours.toLocaleString(locale(), { maximumFractionDigits: 1 }), 'h');
      tile(tiles, 'shield', t.reserve, view.plan ? String(view.plan.reserveSoc) : '–', '%');
      const now = nowMs();
      const current = view.plan && view.plan.intervals.find((iv) => new Date(iv.t).getTime() <= now && new Date(iv.t).getTime() + 900e3 > now);
      tile(tiles, 'tag', t.price, current ? current.price.toLocaleString(locale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '–', `${cur()}/kWh`);
      tile(tiles, 'bolt', t.extra, view.extraPowerCost === null || view.extraPowerCost === undefined
        ? '–' : view.extraPowerCost.toLocaleString(locale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 }), `${cur()}/kWh`);
      const money = (v) => (v === null || v === undefined ? '–' : v.toLocaleString(locale(), { maximumFractionDigits: 0 }));
      if (view.savings) tile(tiles, 'coins', t.savedMonth, money(view.savings.month), cur());
      if (view.peak) {
        const peakTile = tile(tiles, 'gauge', t.peak, view.peak.monthKw === null ? '–'
          : view.peak.monthKw.toLocaleString(locale(), { minimumFractionDigits: 1, maximumFractionDigits: 1 }), 'kW');
        if (view.peak.risk && peakTile) peakTile.classList.add('risk');
      } else if (view.savings) {
        tile(tiles, 'coins', t.savedToday, money(view.savings.today), cur());
      }
      root.appendChild(tiles);

      const footer = document.createElement('div');
      footer.className = 'footer';
      footer.textContent = t.updated(new Date(view.live.at).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: view.timeZone }));
      root.appendChild(footer);
    }

    function onHomeyReady(Homey) {
      const load = () => {
        document.getElementById('root').classList.add('refreshing');
        return Homey.api('GET', '/', {}).then((v) => { view = v; render(); }).catch((err) => {
          document.getElementById('root').classList.remove('refreshing');
          console.error(err);
        });
      };
      const fit = () => {
        const height = Math.ceil(document.body.scrollHeight);
        if (height !== lastHeight) {
          lastHeight = height;
          Homey.setHeight(height);
        }
      };
      let lastHeight = 0;
      window.addEventListener('rendered', fit);
      load().finally(() => {
        lastHeight = Math.ceil(document.body.scrollHeight);
        Homey.ready({ height: lastHeight });
      });
      Homey.on('live', load);
      Homey.on('plan', load);
      setInterval(load, 5 * 60e3);
    }
  </script>
</body>
</html>
