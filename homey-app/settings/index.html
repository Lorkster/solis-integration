als) {\r\n      const T = t();\r\n      const section = document.createElement('div');\r\n      section.className = 'schedule';\r\n      const h = document.createElement('h3');\r\n      h.textContent = T.next24;\r\n      section.appendChild(h);\r\n      const horizon = nowMs() + 24 * 3600e3;\r\n      const upcoming = periods(intervals).filter((p) => new Date(p.start).getTime() < horizon).slice(0, 8);\r\n      const today = fmtDay(new Date(nowMs()).toISOString());\r\n      let dayShown = today;\r\n      for (const p of upcoming) {\r\n        const from = new Date(Math.max(new Date(p.start).getTime(), nowMs())).toISOString();\r\n        if (fmtDay(from) !== dayShown) {\r\n          // One heading where tomorrow starts, instead of repeating the day on every row.\r\n          dayShown = fmtDay(from);\r\n          const day = document.createElement('div');\r\n          day.className = 'day';\r\n          day.textContent = T.tomorrow;\r\n          section.appendChild(day);\r\n        }\r\n        const row = document.createElement('div');\r\n        row.className = 'row';\r\n        row.innerHTML = '<span class=\"dot\"></span><span class=\"what\"></span><span class=\"when\"></span><span class=\"target\"></span>';\r\n        row.querySelector('.dot').style.background = STATE_COLOR[p.state];\r\n        row.querySelector('.what').textContent = T.names[p.state];\r\n        row.querySelector('.when').textContent = `${fmtTime(from)}–${fmtTime(p.end)}`;\r\n        row.querySelector('.target').textContent = `${p.socEnd} %`;\r\n        section.appendChild(row);\r\n      }\r\n      root.appendChild(section);\r\n    }\r\n\r\n    function render() {\r\n      setTimeout(() => window.dispatchEvent(new Event('rendered')), 0);\r\n      const root = document.getElementById('root');\r\n      root.replaceChildren();\r\n      root.classList.remove('refreshing');\r\n      if (!view || !view.ready || !view.plan) {\r\n        const msg = document.createElement('div');\r\n        msg.className = 'message';\r\n        msg.textContent = view && view.paired === false ? t().notPaired : t().waiting;\r\n        root.appendChild(msg);\r\n        return;\r\n      }\r\n      const intervals = visibleIntervals();\r\n      renderHeader(root, intervals);\r\n      renderChart(root, intervals);\r\n      renderSchedule(root, intervals);\r\n      const footer = document.createElement('div');\r\n      footer.className = 'footer';\r\n      const left = document.createElement('span');\r\n      left.innerHTML = t().saves(fmtNum(view.plan.savingsSek, 0));\r\n      const right = document.createElement('span');\r\n      right.textContent = t().updated(fmtTime(view.plan.generatedAt));\r\n      footer.append(left, right);\r\n      root.appendChild(footer);\r\n    }\r\n\r\n    function onHomeyReady(Homey) {\r\n      const settings = Homey.getSettings() || {};\r\n      hoursShown = Number(settings.hours) || 36;\r\n      showEnergy = settings.showEnergy !== false;\r\n      const load = () => {\r\n        document.getElementById('root').classList.add('refreshing');\r\n        return Homey.api('GET', '/', {}).then((v) => { view = v; render(); }).catch((err) => {\r\n          document.getElementById('root').classList.remove('refreshing');\r\n          console.error(err);\r\n        });\r\n      };\r\n      const fit = () => {\r\n        const height = Math.ceil(document.body.scrollHeight);\r\n        if (height !== lastHeight) {\r\n          lastHeight = height;\r\n          Homey.setHeight(height);\r\n        }\r\n      };\r\n      let lastHeight = 0;\r\n      window.addEventListener('rendered', fit);\r\n      load().finally(() => {\r\n        lastHeight = Math.ceil(document.body.scrollHeight);\r\n        Homey.ready({ height: lastHeight });\r\n      });\r\n      Homey.on('plan', load);\r\n      Homey.on('live', load);\r\n      setInterval(load, 10 * 60e3);\r\n      let width = document.body.clientWidth;\r\n      window.addEventListener('resize', () => { if (document.body.clientWidth !== width) { width = document.body.clientWidth; render(); } });\r\n    }\r\n  <\/script>\r\n</body>\r\n</html>\r\n"};
    const TEXT = {
      en: {
        title: 'Solis Smart Battery', updated: (t) => `Updated ${t}`, offline: 'Cannot reach Homey: ',
        setupTitle: 'Connect to Homey',
        setupText: 'This page reads the values straight from Homey on your home network, with a Homey API key. Create one in the Homey web app: Settings → API Keys → New API Key, with only “Apps: control”.',
        address: "Homey's address on your network", apiKey: 'Homey API key', save: 'Connect',
        setupNote: 'The address and key are stored in this browser only and are sent to nothing but your Homey.',
        forget: 'Forget the key on this device',
      },
      sv: {
        title: 'Solis Smart Batteri', updated: (t) => `Uppdaterad ${t}`, offline: 'Når inte Homey: ',
        setupTitle: 'Anslut till Homey',
        setupText: 'Sidan läser värdena direkt från Homey i ditt hemnätverk, med en API-nyckel för Homey. Skapa en i Homeys webbapp: Inställningar → API-nycklar → Ny API-nyckel, med bara ”Appar: kontroll”.',
        address: 'Homeys adress i nätverket', apiKey: 'API-nyckel för Homey', save: 'Anslut',
        setupNote: 'Adressen och nyckeln sparas bara i den här webbläsaren och skickas inte till något annat än din Homey.',
        forget: 'Glöm nyckeln på den här enheten',
      },
    };
    let language = (navigator.language || 'en').startsWith('sv') ? 'sv' : 'en';
    const t = () => TEXT[language];

    // Theme: ?theme=dark|light in the link, otherwise the device setting.
    const params = new URLSearchParams(location.hash.slice(1));
    const theme = params.get('theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
    const isDark = () => theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);

    let source = null; // () => Promise<view>
    let latest = null;
    let pending = null;
    const listeners = [];

    function load() {
      if (!pending) {
        pending = source().then((view) => {
          latest = view;
          pending = null;
          showError(null);
          if (view && view.language) language = view.language === 'sv' ? 'sv' : 'en';
          applyTexts();
          const at = view && view.live && view.live.at;
          document.getElementById('updated').textContent = at
            ? t().updated(new Date(at).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: view.timeZone })) : '';
          return view;
        }, (err) => {
          pending = null;
          showError(t().offline + (err && err.message ? err.message : String(err)));
          if (latest) return latest;
          throw err;
        });
      }
      return pending;
    }

    let mounted = false;

    function refresh() {
      load().then(() => {
        if (!mounted) showWidgets();
        listeners.forEach((cb) => cb());
      }).catch(() => undefined);
    }

    /** The widgets appear once there is data, so a wrong key shows only the error. */
    function showWidgets() {
      mounted = true;
      document.getElementById('widgets').hidden = false;
      for (const frame of document.querySelectorAll('iframe[data-widget]')) mount(frame);
    }

    function showError(text) {
      const box = document.getElementById('error');
      box.hidden = !text;
      box.textContent = text || '';
    }

    function applyTexts() {
      document.getElementById('title').textContent = t().title;
      document.documentElement.lang = language;
      for (const el of document.querySelectorAll('[data-t]')) el.textContent = t()[el.dataset.t];
    }

    /** Homey's widget look: the variables the widgets use. */
    function widgetStyle() {
      const dark = isDark();
      return `:root{--homey-background-color:${dark ? '#1c1c1e' : '#ffffff'};--homey-text-color:${dark ? '#f2f2f7' : '#1c1c1e'};`
        + `--homey-text-color-light:${dark ? '#98989f' : '#8a8a8e'};--homey-color-warning:#fab219;--homey-color-danger:#f44336;`
        + `--homey-color-highlight:${dark ? '#0a84ff' : '#007aff'};--homey-su-2:8px;--homey-su-3:12px;--homey-su-4:16px}`
        + `html,body{background:var(--homey-background-color)}body{margin:0;padding:16px}`;
    }

    /** Runs a widget file in its frame, with this page standing in for Homey's widget runtime. */
    function mount(frame) {
      frame.addEventListener('load', () => {
        const doc = frame.contentDocument;
        const style = doc.createElement('style');
        style.textContent = widgetStyle();
        doc.head.appendChild(style);
        doc.body.classList.toggle('homey-dark-mode', isDark());
        frame.contentWindow.onHomeyReady({
          getSettings: () => ({ hours: frame.dataset.hours || '36', showEnergy: true }),
          api: () => load(),
          on: (_event, cb) => { listeners.push(cb); },
          ready: (opts) => { if (opts && opts.height) frame.style.height = `${Math.ceil(opts.height) + 2}px`; },
          setHeight: (h) => { frame.style.height = `${Math.ceil(h) + 2}px`; },
          __: (key) => key,
        });
      });
      frame.srcdoc = WIDGETS[frame.dataset.widget];
    }

    function start() {
      refresh();
      setInterval(refresh, 60_000);
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => location.reload());
    }

    // --- inside Homey (the app's settings page): data through the logged-in Homey API
    window.onHomeyReady = (Homey) => {
      const api = (method, path, body) => new Promise((resolve, reject) => {
        Homey.api(method, path, body, (err, result) => (err ? reject(err) : resolve(result)));
      });
      source = () => api('GET', '/view');
      Homey.on('live', refresh);
      Homey.on('plan', refresh);
      start();
      Homey.ready();
    };

    // --- on its own (a browser or wall screen at home)
    // Data straight from Homey's local API with a Homey API key: nothing public, nothing via the internet.
    // The address and key live in this browser's storage only, never in the link.
    const STORE = 'solis-dashboard';
    const ADDRESS_STORE = 'solis-dashboard-address'; // kept after "Forget the key", so it need not be typed again
    const stored = () => {
      try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { return null; }
    };
    /** "192.168.1.142" → Homey's local HTTPS name, which has a valid certificate. */
    const homeyBase = (address) => {
      const a = address.trim().replace(/\/+$/, '');
      if (/^https?:\/\//.test(a)) return a;
      return /^\d+\.\d+\.\d+\.\d+$/.test(a) ? `https://${a.replace(/\./g, '-')}.homey.homeylocal.com` : `http://${a}`;
    };
    function connect(config) {
      source = () => fetch(`${homeyBase(config.address)}/api/app/${APP_ID}/view`, {
        cache: 'no-store', headers: { Authorization: `Bearer ${config.key}` },
      }).then((r) => r.json().catch(() => ({})).then((body) => {
        if (!r.ok) throw new Error(body && body.error ? body.error : `HTTP ${r.status}`);
        return body;
      }));
      document.getElementById('forget-row').hidden = false;
      start();
    }
    document.getElementById('forget').addEventListener('click', () => {
      try { localStorage.removeItem(STORE); } catch { /* storage blocked */ }  // the address stays
      location.reload();
    });
    document.getElementById('setup').addEventListener('submit', (event) => {
      event.preventDefault();
      const config = { address: document.getElementById('address').value, key: document.getElementById('api-key').value.trim() };
      try {
        localStorage.setItem(STORE, JSON.stringify(config));
        localStorage.setItem(ADDRESS_STORE, config.address.trim());
      } catch { /* storage blocked: works until reload */ }
      document.getElementById('setup').hidden = true;
      connect(config);
    });
    // Inside Homey, the settings runtime calls onHomeyReady; elsewhere ask for the address and key once.
    setTimeout(() => {
      if (source) return;
      const config = stored();
      if (config && config.address && config.key) connect(config);
      else {
        let last = '';
        try { last = localStorage.getItem(ADDRESS_STORE) || (config && config.address) || ''; } catch { /* storage blocked */ }
        const address = document.getElementById('address');
        address.value = last;
        document.getElementById('setup').hidden = false;
        (last ? document.getElementById('api-key') : address).focus();
      }
    }, 800);
    applyTexts();
  </script>
</body>
