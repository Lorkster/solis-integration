<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* One colour per part of the system, shared with the Battery plan widget. */
    :root {
      --c-solar: #e08a00;
      --c-battery: #2b7de9;
      --c-grid: #7a5af8;
      --c-house: #0e9f7e;
      --c-good: #1a9a4b;
      --c-bad: #d93f3f;
      --c-warn: var(--homey-color-warning, #f5a300);
      --c-ink: var(--homey-text-color, #1a1a1a);
      --c-muted: var(--homey-text-color-light, #8a8a8e);
      --c-surface: var(--homey-background-color, #fff);
      --c-well: rgba(0, 0, 0, 0.045);
      --c-line: rgba(0, 0, 0, 0.09);
      --tint: 14%;
      --on-tint: 62%;
    }
    .homey-dark-mode {
      --c-solar: #f5a524;
      --c-battery: #4c9af2;
      --c-grid: #9d86f5;
      --c-house: #2ec4a0;
      --c-good: #3ccf73;
      --c-bad: #ff6b6b;
      --c-well: rgba(255, 255, 255, 0.07);
      --c-line: rgba(255, 255, 255, 0.12);
      --tint: 22%;
      --on-tint: 100%;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--c-ink); font-variant-numeric: tabular-nums; }
    #root { transition: opacity 0.2s; }
    #root.refreshing { opacity: 0.6; }
    svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Notices */
    .pill { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; padding: 8px 10px; border-radius: 12px; font-size: 12px; line-height: 1.35;
      background: color-mix(in srgb, var(--c-warn) var(--tint), transparent); }
    .pill.info { background: var(--c-well); color: var(--c-muted); }
    .pill.alert { font-weight: 600; background: color-mix(in srgb, var(--c-bad) var(--tint), transparent); }
    .pill svg.i { margin-top: 1px; color: var(--c-warn); }
    .pill.info svg.i { color: var(--c-muted); }
    .pill.alert svg.i { color: var(--c-bad); }

    /* Hero: charge level */
    .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .soc { font-size: 46px; font-weight: 650; line-height: 0.9; letter-spacing: -0.02em; }
    .soc small { font-size: 22px; font-weight: 500; color: var(--c-muted); letter-spacing: 0; margin-left: 2px; }
    .state { text-align: right; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 12px; font-weight: 600;
      color: color-mix(in srgb, var(--c) var(--on-tint), var(--c-ink)); background: color-mix(in srgb, var(--c) var(--tint), transparent); }
    .chip svg.i { width: 14px; height: 14px; stroke-width: 2.5; }
    .state-power { margin-top: 5px; font-size: 16px; font-weight: 600; }
    .bar { position: relative; height: 14px; margin: 14px 0 7px; border-radius: 7px; background: var(--c-well); overflow: hidden; }
    .bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 7px; background: var(--c-battery); transition: width 0.6s ease; }
    .bar-fill.charging { background-image: linear-gradient(90deg, transparent 0 60%, rgba(255, 255, 255, 0.28) 80%, transparent 100%);
      background-size: 120px 100%; background-repeat: no-repeat; animation: sheen 2.4s linear infinite; }
    @keyframes sheen { from { background-position: -120px 0; } to { background-position: calc(100% + 120px) 0; } }
    .bar-reserve { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--c-surface); opacity: 0.9; }
    .bar-caption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 12px; color: var(--c-muted); }
    .bar-caption .plan { color: var(--c-ink); }

    /* Energy flow */
    .flow { margin-top: 14px; }
    .flow svg { display: block; width: 100%; height: auto; overflow: visible; }
    .node-disc { stroke-width: 0; }
    .node-icon { fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .value { font-size: 15px; font-weight: 600; fill: var(--c-ink); }
    .label { font-size: 11.5px; fill: var(--c-muted); }
    .line-base { stroke: var(--c-line); stroke-width: 2; stroke-linecap: round; fill: none; }
    .line-flow { stroke-linecap: round; fill: none; stroke-dasharray: 0.1 9; animation: flow linear infinite; }
    .line-flow.reverse { animation-direction: reverse; }
    @keyframes flow { to { stroke-dashoffset: -18.2; } }
    @media (prefers-reduced-motion: reduce) {
      .line-flow { animation: none; stroke-dasharray: none; opacity: 0.85; }
      .bar-fill.charging { animation: none; background-image: none; }
    }

    /* Supply mix */
    .mix-title { margin-top: 10px; font-size: 12px; color: var(--c-muted); }
    .mix { display: flex; gap: 2px; height: 8px; margin-top: 6px; border-radius: 4px; overflow: hidden; background: var(--c-well); }
    .mix span { min-width: 3px; }
    .mix-legend { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 6px; font-size: 12px; color: var(--c-muted); }
    .mix-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .mix-legend b { color: var(--c-ink); font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }

    /* Tiles */
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
    .tiles.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile { padding: 9px 11px 10px; border-radius: 14px; background: var(--c-well); min-width: 0; }
    .tile.risk { box-shadow: inset 0 0 0 1.5px var(--c-warn); }
    .tile-label { font-size: 11.5px; color: var(--c-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-value { margin-top: 3px; font-size: 19px; font-weight: 650; line-height: 1.15; white-space: nowrap; }
    .tile-unit { font-size: 12px; font-weight: 400; color: var(--c-muted); margin-left: 2px; }
    .tile-sub { margin-top: 3px; font-size: 11px; color: var(--c-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-sub.level { font-weight: 600; color: color-mix(in srgb, var(--c) var(--on-tint), var(--c-ink)); }

    .footer { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 8px; font-size: 11px; color: var(--c-muted); }
    .footer.stale { color: var(--c-warn); font-weight: 600; }
    .footer svg.i { width: 13px; height: 13px; }
    .message { color: var(--c-muted); font-size: 13px; padding: var(--homey-su-4, 16px) 0; text-align: center; }
  </style>
</head>
<body class="homey-widget">
  <div id="root" aria-live="polite"></div>

  <script type="text/javascript">
    const NS = 'http://www.w3.org/2000/svg';
    const TEXT = {
      en: {
        solar: 'Solar', grid: 'Grid', house: 'House', battery: 'Battery',
        importing: 'buying', exporting: 'selling',
        charging: 'Charging', discharging: 'Discharging', idle: 'Idle', full: 'Full',
        reserve: (p) => `Reserve ${p} %`,
        plan: {
          grid_charge: (u, s) => `Grid charging until ${u} · to ${s} %`, save: (u) => `Held for later until ${u}`,
          battery: (u) => `Powers the house until ${u}`, solar_charge: (u, s) => `Solar charging until ${u} · to ${s} %`,
          solar_house: (u) => `Resting until ${u} · solar powers the house`, at_reserve: (u) => `At reserve until ${u}`,
          full: (u) => `Full until ${u}`,
        },
        monitor: 'Monitor only',
        poweredBy: 'House powered by',
        price: 'Price now', backup: 'Backup time', backupSub: 'if the power fails', savedToday: 'Saved today',
        savedMonth: (v) => `Month: ${v}`, peak: 'Power peak', peakSub: 'this month',
        level: { cheap: 'Cheap', normal: 'Normal', expensive: 'Expensive' },
        locked: 'Battery locked by SolisCloud – release it with Quick Control → Discharge (short duration)',
        powerCut: (t) => `Power cut since ${t} – the battery powers the backup output`,
        exportPaused: 'Export paused – selling would cost money right now',
        updated: (t) => `Data from ${t}`, stale: (t) => `No new data since ${t}`,
        waiting: 'Waiting for data…', notPaired: 'Add your inverter in Homey to see its status.',
      },
      sv: {
        solar: 'Sol', grid: 'Nät', house: 'Hus', battery: 'Batteri',
        importing: 'köper', exporting: 'säljer',
        charging: 'Laddar', discharging: 'Laddar ur', idle: 'Vilar', full: 'Fullt',
        reserve: (p) => `Reserv ${p} %`,
        plan: {
          grid_charge: (u, s) => `Nätladdning till ${u} · upp till ${s} %`, save: (u) => `Sparas till senare, till ${u}`,
          battery: (u) => `Driver huset till ${u}`, solar_charge: (u, s) => `Solladdning till ${u} · upp till ${s} %`,
          solar_house: (u) => `Vilar till ${u} · solen driver huset`, at_reserve: (u) => `Vid reserv till ${u}`,
          full: (u) => `Fullt till ${u}`,
        },
        monitor: 'Endast övervakning',
        poweredBy: 'Huset drivs av',
        price: 'Pris nu', backup: 'Reservtid', backupSub: 'vid strömavbrott', savedToday: 'Sparat i dag',
        savedMonth: (v) => `Månad: ${v}`, peak: 'Effekttopp', peakSub: 'denna månad',
        level: { cheap: 'Billigt', normal: 'Normalt', expensive: 'Dyrt' },
        locked: 'Batteriet låst av SolisCloud – frigör med Snabbkontroll → Urladdning (kort tid)',
        powerCut: (t) => `Strömavbrott sedan ${t} – batteriet driver reservutgången`,
        exportPaused: 'Export pausad – det kostar att sälja just nu',
        updated: (t) => `Data från ${t}`, stale: (t) => `Inga nya data sedan ${t}`,
        waiting: 'Väntar på data…', notPaired: 'Lägg till din växelriktare i Homey för att se status.',
      },
    };

    // Icons after Lucide (ISC licence), 24 × 24, drawn with a 2 px stroke.
    const PATHS = {
      solar: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
      grid: '<path d="M12 2v20M2 5h20M3 3v2M7 3v2M17 3v2M21 3v2M19 5l-7 7-7-7"/>',
      house: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      battery: '<rect x="2" y="6" width="16" height="12" rx="2"/><path d="M22 14v-4"/>',
      up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
      down: '<path d="M12 5v14M19 12l-7 7-7-7"/>',
      pause: '<path d="M8 5v14M16 5v14"/>',
      check: '<path d="M20 6 9 17l-5-5"/>',
      warning: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
      plugOff: '<path d="m19 5 3-3M2 22l3-3M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4zM7.5 13.5 10 11M10.5 16.5 13 14M12 6l6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0z"/>',
      tag: '<path d="M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0 0-2 2v7.17a2 2 0 0 0 .59 1.42l8.7 8.7a2.43 2.43 0 0 0 3.42 0l6.58-6.58a2.43 2.43 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/>',
      clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    };
    const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${PATHS[name]}</svg>`;

    let view = null;
    /** Short currency sign for the price area's currency (kr for SEK, NOK, DKK). */
    const cur = () => ({ SEK: 'kr', NOK: 'kr', DKK: 'kr', EUR: '€', PLN: 'zł' })[view && view.currency] || (view && view.currency) || 'kr';
    const T = () => TEXT[view && view.language === 'sv' ? 'sv' : 'en'];
    const locale = () => (view.language === 'sv' ? 'sv-SE' : 'en-GB');
    const num = (v, d = 0, min = 0) => v.toLocaleString(locale(), { maximumFractionDigits: d, minimumFractionDigits: min });
    const fmtTime = (iso) => new Date(iso).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: view.timeZone });
    function nowMs() { return view.mockNow ? new Date(view.mockNow).getTime() : Date.now(); }

    function el(name, attrs, text) {
      const node = document.createElementNS(NS, name);
      for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function div(cls, text) {
      const node = document.createElement('div');
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    /** Watts as "180 W" or "2.6 kW". */
    function power(w) {
      const a = Math.abs(w || 0);
      return a < 1000 ? `${Math.round(a)} W` : `${num(a / 1000, 1, 1)} kW`;
    }

    // --- charge level ---------------------------------------------------------------------------

    /** The plan's current period as one line, e.g. "Powers the house until 21:45". */
    function planLine() {
      const t = T();
      if (view.controlMode !== 'auto') return t.monitor;
      const now = nowMs();
      const period = view.plan && (view.plan.periods || []).find((p) => new Date(p.end).getTime() > now);
      if (!period || !t.plan[period.state]) return '';
      return t.plan[period.state](fmtTime(period.end), Math.round(period.socEnd));
    }

    function renderHero(root) {
      const t = T();
      const live = view.live;
      const soc = Math.max(0, Math.min(100, Math.round(live.socPct || 0)));
      const w = live.batteryW || 0;
      const [state, stateIcon, color] = w > 30 ? [t.charging, 'up', 'var(--c-battery)']
        : w < -30 ? [t.discharging, 'down', 'var(--c-battery)']
          : soc >= 99 ? [t.full, 'check', 'var(--c-house)'] : [t.idle, 'pause', 'var(--c-muted)'];

      const hero = div('hero');
      const value = div('soc');
      value.innerHTML = `${soc}<small>%</small>`;
      const side = div('state');
      const chip = div('chip');
      chip.style.setProperty('--c', color);
      chip.innerHTML = icon(stateIcon);
      chip.appendChild(document.createTextNode(state));
      side.appendChild(chip);
      if (Math.abs(w) > 30) side.appendChild(div('state-power', power(w)));
      hero.append(value, side);
      root.appendChild(hero);

      const bar = div('bar');
      bar.setAttribute('role', 'meter');
      bar.setAttribute('aria-valuemin', '0');
      bar.setAttribute('aria-valuemax', '100');
      bar.setAttribute('aria-valuenow', String(soc));
      bar.setAttribute('aria-label', t.battery);
      const fill = div(w > 30 ? 'bar-fill charging' : 'bar-fill');
      fill.style.width = `${soc}%`;
      bar.appendChild(fill);
      const reserve = view.plan ? view.plan.reserveSoc : null;
      if (reserve !== null && reserve > 0 && reserve < 100) {
        const tick = div('bar-reserve');
        tick.style.left = `${reserve}%`;
        bar.appendChild(tick);
      }
      root.appendChild(bar);

      const caption = div('bar-caption');
      caption.appendChild(div('plan', planLine()));
      if (reserve !== null) caption.appendChild(div('', t.reserve(reserve)));
      root.appendChild(caption);
    }

    // --- energy flow ----------------------------------------------------------------------------

    function renderFlow(root) {
      const t = T();
      const live = view.live;
      const W = 320, H = 222;
      const hub = { x: 160, y: 108 };
      const R = 25;
      const nodes = {
        solar: { x: 160, y: 28, w: live.pvW, color: 'var(--c-solar)', label: t.solar, towardHub: true, text: 'right' },
        grid: {
          x: 40, y: 108, w: live.gridW, color: 'var(--c-grid)', towardHub: live.gridW >= 0, text: 'below',
          label: Math.abs(live.gridW || 0) < 30 ? t.grid : `${t.grid} · ${live.gridW >= 0 ? t.importing : t.exporting}`,
        },
        house: { x: 280, y: 108, w: live.loadW, color: 'var(--c-house)', label: t.house, towardHub: false, text: 'below' },
        battery: { x: 160, y: 188, w: live.batteryW, color: 'var(--c-battery)', label: t.battery, towardHub: live.batteryW < 0, text: 'right' },
      };

      const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
      svg.setAttribute('aria-label', Object.values(nodes).map((n) => `${n.label} ${power(n.w)}`).join(', '));

      for (const n of Object.values(nodes)) {
        const dx = n.x - hub.x, dy = n.y - hub.y, len = Math.hypot(dx, dy);
        const ux = dx / len, uy = dy / len;
        const d = `M${hub.x + ux * 7},${hub.y + uy * 7}L${n.x - ux * (R + 5)},${n.y - uy * (R + 5)}`;
        svg.appendChild(el('path', { d, class: 'line-base' }));
        const kw = Math.abs(n.w || 0) / 1000;
        if (kw >= 0.03) {
          // Thicker for more power; faster for more power.
          const width = 3 + Math.min(1, kw / 8) * 4;
          const seconds = Math.max(0.45, Math.min(2.6, 2.2 - Math.log10(kw * 10) * 0.8));
          const flow = el('path', { d, class: `line-flow${n.towardHub ? ' reverse' : ''}`, stroke: n.color, 'stroke-width': width.toFixed(1) });
          flow.style.animationDuration = `${seconds.toFixed(2)}s`;
          svg.appendChild(flow);
        }
      }
      svg.appendChild(el('circle', { cx: hub.x, cy: hub.y, r: 5, fill: 'var(--c-muted)' }));

      for (const [key, n] of Object.entries(nodes)) {
        const active = Math.abs(n.w || 0) >= 30;
        const tint = active ? `color-mix(in srgb, ${n.color} var(--tint), transparent)` : 'var(--c-well)';
        svg.appendChild(el('circle', { cx: n.x, cy: n.y, r: R, class: 'node-disc', fill: tint }));
        const g = el('g', { transform: `translate(${n.x - 12},${n.y - 12})`, class: 'node-icon', stroke: active ? n.color : 'var(--c-muted)' });
        g.innerHTML = PATHS[key];
        if (key === 'battery') {
          // The battery icon shows the charge level.
          const soc = Math.max(0, Math.min(100, live.socPct || 0));
          g.appendChild(el('rect', { x: 4.5, y: 8.5, width: Math.max(0.01, (11 * soc) / 100), height: 7, rx: 0.8, fill: active ? n.color : 'var(--c-muted)', stroke: 'none' }));
        }
        svg.appendChild(g);

        const value = power(n.w);
        if (n.text === 'right') {
          svg.appendChild(el('text', { x: n.x + R + 12, y: n.y - 1, class: 'value' }, value));
          svg.appendChild(el('text', { x: n.x + R + 12, y: n.y + 15, class: 'label' }, n.label));
        } else {
          svg.appendChild(el('text', { x: n.x, y: n.y + R + 20, 'text-anchor': 'middle', class: 'value' }, value));
          svg.appendChild(el('text', { x: n.x, y: n.y + R + 35, 'text-anchor': 'middle', class: 'label' }, n.label));
        }
      }
      const wrap = div('flow');
      wrap.appendChild(svg);
      root.appendChild(wrap);
    }

    // --- supply mix -----------------------------------------------------------------------------

    function renderMix(root) {
      const t = T();
      const s = view.supply;
      const parts = [[s.solarPct, t.solar, 'var(--c-solar)'], [s.batteryPct, t.battery, 'var(--c-battery)'], [s.gridPct, t.grid, 'var(--c-grid)']]
        .filter(([pct]) => pct > 0).sort((a, b) => b[0] - a[0]);
      if (parts.length === 0) return;
      root.appendChild(div('mix-title', t.poweredBy));
      const bar = div('mix');
      bar.setAttribute('role', 'img');
      bar.setAttribute('aria-label', `${t.poweredBy}: ${parts.map(([pct, name]) => `${name} ${pct} %`).join(', ')}`);
      const legend = div('mix-legend');
      for (const [pct, name, color] of parts) {
        const seg = document.createElement('span');
        seg.style.flex = String(pct);
        seg.style.background = color;
        bar.appendChild(seg);
        const item = document.createElement('span');
        item.innerHTML = `<i class="dot" style="background:${color}"></i>`;
        item.appendChild(document.createTextNode(`${name} `));
        const b = document.createElement('b');
        b.textContent = `${pct} %`;
        item.appendChild(b);
        legend.appendChild(item);
      }
      root.append(bar, legend);
    }

    // --- tiles ----------------------------------------------------------------------------------

    function tile(root, label, value, unit, sub) {
      const node = div('tile');
      node.appendChild(div('tile-label', label));
      const v = div('tile-value', value);
      if (unit) {
        const u = document.createElement('span');
        u.className = 'tile-unit';
        u.textContent = unit;
        v.appendChild(u);
      }
      node.appendChild(v);
      if (sub) node.appendChild(sub);
      root.appendChild(node);
      return node;
    }

    function renderTiles(root) {
      const t = T();
      const tiles = div('tiles');
      const now = nowMs();
      const current = view.plan && view.plan.intervals.find((iv) => new Date(iv.t).getTime() <= now && new Date(iv.t).getTime() + 900e3 > now);
      let levelSub = null;
      if (view.powerLevel && t.level[view.powerLevel.level]) {
        levelSub = div('tile-sub level', t.level[view.powerLevel.level]);
        levelSub.style.setProperty('--c', { cheap: 'var(--c-good)', normal: 'var(--c-muted)', expensive: 'var(--c-bad)' }[view.powerLevel.level]);
      }
      tile(tiles, t.price, current && Number.isFinite(current.price) ? num(current.price, 2, 2) : '–', `${cur()}/kWh`, levelSub);
      const hours = view.live.backupHours;
      tile(tiles, t.backup, hours === null || hours === undefined ? '–' : num(hours, 1), 'h', div('tile-sub', t.backupSub));
      const money = (v) => (v === null || v === undefined ? '–' : num(v, 0));
      if (view.savings) {
        tile(tiles, t.savedToday, money(view.savings.today), cur(), div('tile-sub', t.savedMonth(`${money(view.savings.month)} ${cur()}`)));
      }
      if (view.peak) {
        const peak = tile(tiles, t.peak, view.peak.monthKw === null ? '–' : num(view.peak.monthKw, 1, 1), 'kW', div('tile-sub', t.peakSub));
        if (view.peak.risk) peak.classList.add('risk');
        tiles.classList.add('four');
      }
      root.appendChild(tiles);
    }

    // --- page -----------------------------------------------------------------------------------

    function renderNotices(root) {
      const t = T();
      const notices = (view.warnings || []).map((w) => ['warning', `${w.title} · ${w.area}`]);
      if (view.exportPaused) notices.push(['tag', t.exportPaused, 'info']);
      if (view.offPlan) notices.unshift(['warning', view.offPlan]);
      if (view.batteryLocked) notices.unshift(['warning', t.locked]);
      if (view.powerCut) notices.unshift(['plugOff', t.powerCut(fmtTime(view.powerCut.since)), 'alert']);
      for (const [name, text, kind] of notices) {
        const pill = div(kind ? `pill ${kind}` : 'pill');
        pill.innerHTML = icon(name);
        pill.appendChild(document.createTextNode(text));
        root.appendChild(pill);
      }
    }

    function render() {
      setTimeout(() => window.dispatchEvent(new Event('rendered')), 0);
      const root = document.getElementById('root');
      root.replaceChildren();
      root.classList.remove('refreshing');
      const t = T();
      if (!view || !view.live) {
        root.appendChild(div('message', view && view.paired === false ? t.notPaired : t.waiting));
        return;
      }
      renderNotices(root);
      renderHero(root);
      renderFlow(root);
      if (view.supply) renderMix(root);
      renderTiles(root);

      // Data older than 15 minutes is called out; fresh data just shows its time.
      const at = new Date(view.live.at).getTime();
      const stale = nowMs() - at > 15 * 60e3;
      const footer = div(stale ? 'footer stale' : 'footer');
      if (stale) footer.innerHTML = icon('clock');
      footer.appendChild(document.createTextNode((stale ? t.stale : t.updated)(fmtTime(view.live.at))));
      root.appendChild(footer);
    }

    function onHomeyReady(Homey) {
      const load = () => {
        document.getElementById('root').classList.add('refreshing');
        return Homey.api('GET', '/', {}).then((v) => { view = v; render(); }).catch((err) => {
          document.getElementById('root').classList.remove('refreshing');
          console.error(err);
        });
      };
      const fit = () => {
        const height = Math.ceil(document.body.scrollHeight);
        if (height !== lastHeight) {
          lastHeight = height;
          Homey.setHeight(height);
        }
      };
      let lastHeight = 0;
      window.addEventListener('rendered', fit);
      load().finally(() => {
        lastHeight = Math.ceil(document.body.scrollHeight);
        Homey.ready({ height: lastHeight });
      });
      Homey.on('live', load);
      Homey.on('plan', load);
      setInterval(load, 5 * 60e3);
    }
  </script>
</body>
</html>
