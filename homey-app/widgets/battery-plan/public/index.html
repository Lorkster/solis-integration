<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --c-charge: #2a78d6;
      --c-hold: #e87ba4;
      --c-solar: #eda100;
      --c-use: #008300;
      --c-quiet: var(--homey-text-color-light, #8a8a8e);
      --c-ink: var(--homey-text-color, #1a1a1a);
      --c-muted: var(--homey-text-color-light, #8a8a8e);
      --c-grid: rgba(0, 0, 0, 0.08);
      --c-surface: var(--homey-background-color, #fff);
    }
    .homey-dark-mode {
      --c-charge: #3987e5;
      --c-hold: #d55181;
      --c-solar: #c98500;
      --c-grid: rgba(255, 255, 255, 0.10);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--c-ink); }
    #root { transition: opacity 0.2s; }
    #root.refreshing { opacity: 0.6; }

    /* Status header */
    .status { display: flex; align-items: center; gap: var(--homey-su-3, 12px); }
    .status-icon { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--c-grid); }
    .status-icon svg { width: 20px; height: 20px; }
    .status-text { flex: 1; min-width: 0; }
    .status-title { font-weight: 600; font-size: var(--homey-font-size-default, 15px); line-height: 1.3; }
    .status-sub { color: var(--c-muted); font-size: var(--homey-font-size-small, 13px); line-height: 1.3; }
    .soc { text-align: right; flex: none; }
    .soc-value { font-weight: 600; font-size: 22px; line-height: 1; }
    .soc-label { color: var(--c-muted); font-size: 11px; }

    .pill { display: inline-flex; align-items: center; gap: 6px; margin-top: var(--homey-su-2, 8px); padding: 4px 10px; border-radius: 999px; font-size: 12px; background: var(--c-grid); }
    .pill svg { width: 14px; height: 14px; flex: none; }
    .pill.warning { background: color-mix(in srgb, var(--homey-color-warning, #fab219) 22%, transparent); }

    /* Chart */
    .chart { position: relative; margin-top: var(--homey-su-3, 12px); touch-action: pan-y; }
    .chart svg { display: block; width: 100%; overflow: visible; }
    .chart:focus { outline: none; }
    .chart:focus-visible { outline: 2px solid var(--homey-color-highlight, #0092ff); outline-offset: 4px; border-radius: 4px; }
    .axis-text { font-size: 10px; fill: var(--c-muted); font-variant-numeric: tabular-nums; }
    .panel-title { font-size: 10px; fill: var(--c-muted); font-weight: 600; letter-spacing: 0.02em; }
    .band-label { font-size: 10px; fill: var(--c-ink); font-weight: 600; }
    .band-label.quiet { fill: var(--c-muted); font-weight: 400; }

    .tooltip { position: absolute; top: 0; pointer-events: none; min-width: 132px; padding: 8px 10px; border-radius: 8px;
      background: var(--c-surface); box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18); font-size: 12px; line-height: 1.45; display: none; z-index: 2; }
    .tooltip.visible { display: block; }
    .tt-time { color: var(--c-muted); margin-bottom: 2px; }
    .tt-row { display: flex; align-items: center; gap: 6px; }
    .tt-row b { font-weight: 600; }
    .tt-row span.l { color: var(--c-muted); }
    .key { width: 10px; height: 3px; border-radius: 2px; flex: none; }

    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: var(--homey-su-2, 8px); font-size: 11px; color: var(--c-muted); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; }

    /* Schedule list (also the table view of the chart) */
    .schedule { margin-top: var(--homey-su-3, 12px); border-top: 1px solid var(--c-grid); }
    .schedule h3 { margin: var(--homey-su-2, 8px) 0 2px; font-size: 11px; font-weight: 600; color: var(--c-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
    .row + .row { border-top: 1px solid var(--c-grid); }
    .row .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .row .what { flex: 1; }
    .row .when { font-variant-numeric: tabular-nums; }
    .row .target { color: var(--c-muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

    .footer { display: flex; justify-content: space-between; gap: 8px; margin-top: var(--homey-su-2, 8px); font-size: 11px; color: var(--c-muted); }
    .footer b { color: var(--c-ink); font-weight: 600; }
    .message { color: var(--c-muted); font-size: 13px; padding: var(--homey-su-4, 16px) 0; text-align: center; }
  </style>
</head>
<body class="homey-widget">
  <div id="root" aria-live="polite"></div>

  <script type="text/javascript">
    const NS = 'http://www.w3.org/2000/svg';

    const TEXT = {
      en: {
        names: {
          grid_charge: 'Grid charging', save: 'Saving for later', battery: 'Battery powers house',
          solar_charge: 'Solar charging', at_reserve: 'At reserve · grid powers house', full: 'Full · solar powers house',
        },
        bands: { grid_charge: 'Grid', save: 'Save', battery: 'Battery', solar_charge: 'Solar', at_reserve: 'Reserve', full: 'Full' },
        titles: {
          grid_charge: 'Charging from the grid', save: 'Saving the battery for later', battery: 'Battery powers the house',
          solar_charge: 'Solar charges the battery', at_reserve: 'Battery at reserve', full: 'Battery full',
        },
        subs: {
          grid_charge: (u, soc) => `until ${u} · to ${soc} %`, save: (u) => `until ${u} · grid powers the house`,
          battery: (u, soc) => `until ${u} · down to ${soc} %`, solar_charge: (u, soc) => `until ${u} · up to ${soc} %`,
          at_reserve: (u) => `until ${u} · grid powers the house`, full: (u) => `until ${u} · solar powers the house`,
        },
        quiet: 'At reserve / full',
        monitor: 'Monitor only – the app is not controlling the inverter',
        locked: 'Battery locked by SolisCloud – release it with Quick Control → Discharge (short duration)',
        outage: (until) => `Preparing for a power outage until ${until}`,
        price: () => `Price ${cur()}/kWh`, energy: 'Solar & load kW', battery: 'Battery %',
        solar: 'Solar', load: 'Load', reserve: 'Reserve', now: 'Now',
        next24: 'Next 24 hours',
        saves: (amount) => `≈ <b>${amount} ${cur()}</b> cheaper than plain self-use`,
        updated: (t) => `Updated ${t}`,
        waiting: 'Waiting for the first plan…', notPaired: 'Add your Solis inverter in Homey to see the plan.',
        today: 'Today', tomorrow: 'Tomorrow', soc: 'charged',
      },
      sv: {
        names: {
          grid_charge: 'Nätladdning', save: 'Sparar till senare', battery: 'Batteriet driver huset',
          solar_charge: 'Solladdning', at_reserve: 'Vid reserv · nätet driver huset', full: 'Fullt · solen driver huset',
        },
        bands: { grid_charge: 'Nät', save: 'Spara', battery: 'Batteri', solar_charge: 'Sol', at_reserve: 'Reserv', full: 'Fullt' },
        titles: {
          grid_charge: 'Laddar från nätet', save: 'Sparar batteriet till senare', battery: 'Batteriet driver huset',
          solar_charge: 'Solen laddar batteriet', at_reserve: 'Batteriet vid reserv', full: 'Batteriet fullt',
        },
        subs: {
          grid_charge: (u, soc) => `till ${u} · upp till ${soc} %`, save: (u) => `till ${u} · nätet driver huset`,
          battery: (u, soc) => `till ${u} · ner till ${soc} %`, solar_charge: (u, soc) => `till ${u} · upp till ${soc} %`,
          at_reserve: (u) => `till ${u} · nätet driver huset`, full: (u) => `till ${u} · solen driver huset`,
        },
        quiet: 'Vid reserv / fullt',
        monitor: 'Endast övervakning – appen styr inte växelriktaren',
        locked: 'Batteriet låst av SolisCloud – frigör med Snabbkontroll → Urladdning (kort tid)',
        outage: (until) => `Förbereder för strömavbrott till ${until}`,
        price: () => `Pris ${cur()}/kWh`, energy: 'Sol & förbrukning kW', battery: 'Batteri %',
        solar: 'Sol', load: 'Förbrukning', reserve: 'Reserv', now: 'Nu',
        next24: 'Kommande 24 timmar',
        saves: (amount) => `≈ <b>${amount} ${cur()}</b> billigare än vanlig egenanvändning`,
        updated: (t) => `Uppdaterad ${t}`,
        waiting: 'Väntar på den första planen…', notPaired: 'Lägg till din Solis-växelriktare i Homey för att se planen.',
        today: 'Idag', tomorrow: 'Imorgon', soc: 'laddat',
      },
    };

    const ICON = {
      grid_charge: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
      save: '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
      battery: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M10 2h4M12 16V9M9 12l3-3 3 3"/>',
      solar_charge: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
      at_reserve: '<path d="M12 21.5s7.5-3.2 7.5-9.5V5.5L12 2.5 4.5 5.5V12c0 6.3 7.5 9.5 7.5 9.5z"/>',
      full: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M10 2h4M9 8h6M9 12h6M9 16h6"/>',
      warning: '<path d="M10.3 3.7L2.4 17.5A2 2 0 004.1 20.5h15.8a2 2 0 001.7-3L13.7 3.7a2 2 0 00-3.4 0z"/><path d="M12 9v4.5M12 16.8v.1"/>',
      shield: '<path d="M12 21.5s7.5-3.2 7.5-9.5V5.5L12 2.5 4.5 5.5V12c0 6.3 7.5 9.5 7.5 9.5z"/>',
      eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    };
    const icon = (name, color) =>
      `<svg viewBox="0 0 24 24" fill="none" stroke="${color || 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

    const STATE_COLOR = {
      grid_charge: 'var(--c-charge)', save: 'var(--c-hold)', battery: 'var(--c-use)',
      solar_charge: 'var(--c-solar)', at_reserve: 'var(--c-quiet)', full: 'var(--c-quiet)',
    };
    const QUIET = new Set(['at_reserve', 'full']);

    let view = null;
    /** Short currency sign for the price area's currency (kr for SEK, NOK, DKK). */
    const cur = () => ({ SEK: 'kr', NOK: 'kr', DKK: 'kr', EUR: '€', PLN: 'zł' })[view && view.currency] || (view && view.currency) || 'kr';
    let hoursShown = 36;
    let showEnergy = true;
    let cursor = null; // index of interval under the crosshair

    function t() { return TEXT[view && view.language === 'sv' ? 'sv' : 'en']; }

    function el(name, attrs, text) {
      const node = document.createElementNS(NS, name);
      for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function fmtTime(iso) {
      return new Date(iso).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: view.timeZone });
    }
    function fmtDay(iso) {
      return new Date(iso).toLocaleDateString('sv-SE', { timeZone: view.timeZone });
    }
    function fmtNum(v, d) {
      return Number(v).toLocaleString(view.language === 'sv' ? 'sv-SE' : 'en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function nowMs() { return view.mockNow ? new Date(view.mockNow).getTime() : Date.now(); }

    function visibleIntervals() {
      const end = nowMs() + hoursShown * 3600e3;
      return view.plan.intervals.filter((iv) => new Date(iv.t).getTime() < end);
    }

    /** The app's periods within the visible intervals, with interval indexes for drawing. */
    function periods(intervals) {
      const t0 = new Date(intervals[0].t).getTime();
      const n = intervals.length;
      return (view.plan.periods || [])
        .map((p) => ({ ...p, from: Math.round((new Date(p.start).getTime() - t0) / 900e3), to: Math.round((new Date(p.end).getTime() - t0) / 900e3) - 1 }))
        .filter((p) => p.to >= 0 && p.from < n)
        .map((p) => ({ ...p, from: Math.max(0, p.from), to: Math.min(n - 1, p.to) }));
    }

    function renderHeader(root, intervals) {
      const T = t();
      const current = intervals[0];
      const first = periods(intervals)[0];
      const state = first ? first.state : current.state;
      const sub = first ? T.subs[state](fmtTime(first.end), Math.round(first.socEnd)) : '';
      const soc = view.live ? view.live.socPct : Math.round(current.soc);
      const header = document.createElement('div');
      header.className = 'status';
      header.innerHTML = `
        <div class="status-icon">${icon(state, QUIET.has(state) ? 'var(--c-ink)' : STATE_COLOR[state])}</div>
        <div class="status-text"><div class="status-title"></div><div class="status-sub"></div></div>
        <div class="soc"><div class="soc-value">${soc} %</div><div class="soc-label">${T.soc}</div></div>`;
      header.querySelector('.status-title').textContent = T.titles[state];
      header.querySelector('.status-sub').textContent = sub;
      root.appendChild(header);

      if (view.batteryLocked) {
        const pill = document.createElement('div');
        pill.className = 'pill warning';
        pill.innerHTML = icon('warning');
        pill.appendChild(document.createTextNode(T.locked));
        root.appendChild(pill);
      }
      for (const w of view.warnings || []) {
        const pill = document.createElement('div');
        pill.className = 'pill warning';
        pill.innerHTML = icon('warning');
        pill.appendChild(document.createTextNode(`${w.title} · ${w.area}`));
        root.appendChild(pill);
      }
      if (view.outageUntil) {
        const pill = document.createElement('div');
        pill.className = 'pill';
        pill.innerHTML = icon('shield');
        pill.appendChild(document.createTextNode(T.outage(`${fmtTime(view.outageUntil)}`)));
        root.appendChild(pill);
      }
      if (view.controlMode !== 'auto') {
        const pill = document.createElement('div');
        pill.className = 'pill';
        pill.innerHTML = icon('eye');
        pill.appendChild(document.createTextNode(T.monitor));
        root.appendChild(pill);
      }
    }

    function niceDomain(min, max, steps) {
      const span = Math.max(max - min, 0.1);
      const raw = span / steps;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const step = [1, 2, 5, 10].map((m) => m * mag).find((s) => s >= raw);
      return { lo: Math.floor(min / step) * step, hi: Math.ceil(max / step) * step, step };
    }

    function renderChart(root, intervals) {
      const T = t();
      const wrap = document.createElement('div');
      wrap.className = 'chart';
      wrap.tabIndex = 0;
      wrap.setAttribute('role', 'img');
      root.appendChild(wrap);

      const W = Math.max(wrap.clientWidth, 260);
      const LEFT = 30, RIGHT = 4;
      const plotW = W - LEFT - RIGHT;
      const TITLE = 24, GAP = 8;
      const panels = [{ key: 'price', h: 86 }];
      if (showEnergy) panels.push({ key: 'energy', h: 58 });
      panels.push({ key: 'battery', h: 52 });
      let y = 0;
      for (const p of panels) { p.top = y + TITLE; p.bottom = p.top + p.h; y = p.bottom + GAP; }
      const H = y - GAP + 18;

      const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H });
      wrap.appendChild(svg);
      const n = intervals.length;
      const x = (i) => LEFT + (i / n) * plotW;
      const start = new Date(intervals[0].t).getTime();

      // Action washes across all panels, a solid strip on top of the price panel, and direct labels.
      const top = panels[0].top, bottom = panels[panels.length - 1].bottom;
      for (const b of periods(intervals)) {
        const x0 = x(b.from), x1 = x(b.to + 1);
        const quiet = QUIET.has(b.state);
        if (!quiet) {
          const wash = b.state === 'battery' || b.state === 'solar_charge' ? 0.07 : 0.1;
          svg.appendChild(el('rect', { x: x0, y: top, width: Math.max(x1 - x0, 1), height: bottom - top, fill: STATE_COLOR[b.state], opacity: wash }));
        }
        svg.appendChild(el('rect', { x: x0, y: top, width: Math.max(x1 - x0 - 2, 1), height: 3, rx: 1.5, fill: STATE_COLOR[b.state], opacity: quiet ? 0.6 : 1 }));
        const label = T.bands[b.state];
        if (x1 - x0 > label.length * 6 + 8) {
          svg.appendChild(el('text', { x: x0 + 4, y: top + 14, class: quiet ? 'band-label quiet' : 'band-label' }, label));
        }
      }

      for (const p of panels) {
        let values, series;
        if (p.key === 'price') {
          values = intervals.map((iv) => iv.price);
          p.dom = niceDomain(Math.min(...values), Math.max(...values), 2);
          p.title = T.price();
        } else if (p.key === 'energy') {
          const maxKw = Math.max(1, ...intervals.map((iv) => Math.max(iv.pvKw, iv.loadKw)));
          p.dom = niceDomain(0, maxKw, 3);
          p.title = T.energy;
        } else {
          p.dom = { lo: 0, hi: 100, step: 50 };
          p.title = `${T.battery} · ${T.reserve.toLowerCase()} ${view.plan.reserveSoc} %`;
        }
        p.y = (v) => p.bottom - ((v - p.dom.lo) / (p.dom.hi - p.dom.lo)) * p.h;

        svg.appendChild(el('text', { x: 0, y: p.top - 12, class: 'panel-title' }, p.title));
        for (let v = p.dom.lo; v <= p.dom.hi + 1e-9; v += p.dom.step) {
          const yy = p.y(v);
          svg.appendChild(el('line', { x1: LEFT, x2: W - RIGHT, y1: yy, y2: yy, stroke: 'var(--c-grid)', 'stroke-width': 1 }));
          svg.appendChild(el('text', { x: LEFT - 5, y: yy + 3, 'text-anchor': 'end', class: 'axis-text' }, fmtNum(v, p.dom.step < 1 ? 1 : 0)));
        }

        if (p.key === 'price') {
          let d = '';
          intervals.forEach((iv, i) => { d += `${i ? 'L' : 'M'}${x(i)},${p.y(iv.price)}H${x(i + 1)}`; });
          svg.appendChild(el('path', { d, fill: 'none', stroke: 'var(--c-ink)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
        } else if (p.key === 'energy') {
          let area = `M${x(0)},${p.y(0)}`;
          intervals.forEach((iv, i) => { area += `L${x(i + 0.5)},${p.y(iv.pvKw)}`; });
          area += `L${x(n)},${p.y(0)}Z`;
          svg.appendChild(el('path', { d: area, fill: 'var(--c-solar)', opacity: 0.18 }));
          const pv = intervals.map((iv, i) => `${i ? 'L' : 'M'}${x(i + 0.5)},${p.y(iv.pvKw)}`).join('');
          svg.appendChild(el('path', { d: pv, fill: 'none', stroke: 'var(--c-solar)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
          const load = intervals.map((iv, i) => `${i ? 'L' : 'M'}${x(i + 0.5)},${p.y(iv.loadKw)}`).join('');
          svg.appendChild(el('path', { d: load, fill: 'none', stroke: 'var(--c-muted)', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }));
        } else {
          const ry = p.y(view.plan.reserveSoc);
          svg.appendChild(el('line', { x1: LEFT, x2: W - RIGHT, y1: ry, y2: ry, stroke: 'var(--c-muted)', 'stroke-width': 1, 'stroke-dasharray': '4 3' }));
          let area = `M${x(0)},${p.y(0)}`;
          const line = intervals.map((iv, i) => `${i ? 'L' : 'M'}${x(i + 1)},${p.y(iv.soc)}`).join('');
          intervals.forEach((iv, i) => { area += `L${x(i + 1)},${p.y(iv.soc)}`; });
          area += `L${x(n)},${p.y(0)}Z`;
          svg.appendChild(el('path', { d: area, fill: 'var(--c-ink)', opacity: 0.06 }));
          svg.appendChild(el('path', { d: line, fill: 'none', stroke: 'var(--c-ink)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
          if (view.live) {
            // Current state of charge as an end-dot at the start of the forecast.
            svg.appendChild(el('circle', { cx: x(0), cy: p.y(view.live.socPct), r: 4, fill: 'var(--c-ink)', stroke: 'var(--c-surface)', 'stroke-width': 2 }));
          }
        }
      }

      // Time axis: every 3 hours on the hour (6 when narrow), day name at midnight; keep clear of "Now".
      const today = fmtDay(new Date(nowMs()).toISOString());
      const nowX = x((nowMs() - start) / 900e3);
      const every = plotW / n * 12 < 34 ? 6 : 3;
      intervals.forEach((iv, i) => {
        const hhmm = fmtTime(iv.t);
        if (!hhmm.endsWith(':00') || Number(hhmm.slice(0, 2)) % every !== 0 || i === 0) return;
        if (Math.abs(x(i) - nowX) < 30) return;
        const midnight = hhmm === '00:00';
        const label = midnight ? (fmtDay(iv.t) === today ? T.today : T.tomorrow) : hhmm.slice(0, 2);
        if (midnight) svg.appendChild(el('line', { x1: x(i), x2: x(i), y1: top, y2: bottom, stroke: 'var(--c-grid)', 'stroke-width': 1 }));
        svg.appendChild(el('text', { x: x(i), y: bottom + 13, 'text-anchor': 'middle', class: 'axis-text', 'font-weight': midnight ? 600 : 400 }, label));
      });

      // "Now" marker at the left edge of the current interval.
      if (nowX >= LEFT && nowX <= W) {
        svg.appendChild(el('line', { x1: nowX, x2: nowX, y1: top - 2, y2: bottom, stroke: 'var(--c-ink)', 'stroke-width': 1 }));
        svg.appendChild(el('text', { x: nowX, y: bottom + 13, 'text-anchor': 'middle', class: 'axis-text', 'font-weight': 600 }, T.now));
      }

      // Crosshair + tooltip: pointer, touch and keyboard.
      const hair = el('line', { y1: top - 2, y2: bottom, stroke: 'var(--c-ink)', 'stroke-width': 1, opacity: 0.5, visibility: 'hidden' });
      svg.appendChild(hair);
      const dots = panels.filter((p) => p.key !== 'energy').map((p) => {
        const c = el('circle', { r: 4, fill: 'var(--c-ink)', stroke: 'var(--c-surface)', 'stroke-width': 2, visibility: 'hidden' });
        svg.appendChild(c);
        return { p, c };
      });
      const tip = document.createElement('div');
      tip.className = 'tooltip';
      wrap.appendChild(tip);

      function show(i) {
        cursor = Math.max(0, Math.min(n - 1, i));
        const iv = intervals[cursor];
        const cx = x(cursor + 0.5);
        hair.setAttribute('x1', cx); hair.setAttribute('x2', cx); hair.setAttribute('visibility', 'visible');
        for (const { p, c } of dots) {
          c.setAttribute('cx', p.key === 'battery' ? x(cursor + 1) : cx);
          c.setAttribute('cy', p.key === 'price' ? p.y(iv.price) : p.y(iv.soc));
          c.setAttribute('visibility', 'visible');
        }
        tip.replaceChildren();
        const time = document.createElement('div');
        time.className = 'tt-time';
        const day = fmtDay(iv.t) === fmtDay(new Date(nowMs()).toISOString()) ? '' : `${t().tomorrow} `;
        time.textContent = `${day}${fmtTime(iv.t)}–${fmtTime(new Date(new Date(iv.t).getTime() + 900e3).toISOString())}`;
        tip.appendChild(time);
        const row = (key, value, label) => {
          const r = document.createElement('div');
          r.className = 'tt-row';
          const k = document.createElement('span'); k.className = 'key'; k.style.background = key; r.appendChild(k);
          const b = document.createElement('b'); b.textContent = value; r.appendChild(b);
          const l = document.createElement('span'); l.className = 'l'; l.textContent = label; r.appendChild(l);
          tip.appendChild(r);
        };
        row('var(--c-ink)', `${fmtNum(iv.price, 2)} ${cur()}`, '/kWh');
        row(STATE_COLOR[iv.state], T.names[iv.state], '');
        if (showEnergy) {
          row('var(--c-solar)', `${fmtNum(iv.pvKw, 1)} kW`, T.solar);
          row('var(--c-muted)', `${fmtNum(iv.loadKw, 1)} kW`, T.load);
        }
        row('var(--c-ink)', `${Math.round(iv.soc)} %`, T.battery.replace(' %', ''));
        tip.classList.add('visible');
        const tw = tip.offsetWidth;
        tip.style.left = `${cx + 12 + tw > W ? cx - tw - 12 : cx + 12}px`;
        tip.style.top = `${panels[0].top}px`;
      }
      function hide() {
        cursor = null;
        hair.setAttribute('visibility', 'hidden');
        for (const { c } of dots) c.setAttribute('visibility', 'hidden');
        tip.classList.remove('visible');
      }
      const indexAt = (clientX) => Math.floor(((clientX - wrap.getBoundingClientRect().left - LEFT) / plotW) * n);
      wrap.addEventListener('pointermove', (e) => show(indexAt(e.clientX)));
      wrap.addEventListener('pointerdown', (e) => show(indexAt(e.clientX)));
      wrap.addEventListener('pointerleave', hide);
      wrap.addEventListener('blur', hide);
      wrap.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') show((cursor ?? -1) + 1);
        else if (e.key === 'ArrowLeft') show((cursor ?? 1) - 1);
        else if (e.key === 'Escape') hide();
        else return;
        e.preventDefault();
      });
      wrap.setAttribute('aria-label', `${T.price()}, ${T.energy}, ${T.battery}`);

      const legend = document.createElement('div');
      legend.className = 'legend';
      const item = (html) => { const s = document.createElement('span'); s.innerHTML = html; legend.appendChild(s); };
      for (const state of ['grid_charge', 'save', 'battery', 'solar_charge']) {
        item(`<i class="swatch" style="background:${STATE_COLOR[state]}"></i>${T.names[state]}`);
      }
      item(`<i class="swatch" style="background:var(--c-quiet);opacity:.6"></i>${T.quiet}`);
      if (showEnergy) {
        item(`<i class="key" style="background:var(--c-solar)"></i>${T.solar}`);
        item(`<i class="key" style="background:var(--c-muted)"></i>${T.load}`);
      }
      root.appendChild(legend);
    }

    function renderSchedule(root, intervals) {
      const T = t();
      const section = document.createElement('div');
      section.className = 'schedule';
      const h = document.createElement('h3');
      h.textContent = T.next24;
      section.appendChild(h);
      const horizon = nowMs() + 24 * 3600e3;
      const upcoming = periods(intervals).filter((p) => new Date(p.start).getTime() < horizon).slice(0, 8);
      for (const p of upcoming) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = '<span class="dot"></span><span class="what"></span><span class="when"></span><span class="target"></span>';
        row.querySelector('.dot').style.background = STATE_COLOR[p.state];
        row.querySelector('.what').textContent = T.names[p.state];
        row.querySelector('.when').textContent = `${fmtTime(new Date(Math.max(new Date(p.start).getTime(), nowMs())).toISOString())}–${fmtTime(p.end)}`;
        row.querySelector('.target').textContent = `${p.socEnd} %`;
        section.appendChild(row);
      }
      root.appendChild(section);
    }

    function render() {
      setTimeout(() => window.dispatchEvent(new Event('rendered')), 0);
      const root = document.getElementById('root');
      root.replaceChildren();
      root.classList.remove('refreshing');
      if (!view || !view.ready || !view.plan) {
        const msg = document.createElement('div');
        msg.className = 'message';
        msg.textContent = view && view.paired === false ? t().notPaired : t().waiting;
        root.appendChild(msg);
        return;
      }
      const intervals = visibleIntervals();
      renderHeader(root, intervals);
      renderChart(root, intervals);
      renderSchedule(root, intervals);
      const footer = document.createElement('div');
      footer.className = 'footer';
      const left = document.createElement('span');
      left.innerHTML = t().saves(fmtNum(view.plan.savingsSek, 0));
      const right = document.createElement('span');
      right.textContent = t().updated(fmtTime(view.plan.generatedAt));
      footer.append(left, right);
      root.appendChild(footer);
    }

    function onHomeyReady(Homey) {
      const settings = Homey.getSettings() || {};
      hoursShown = Number(settings.hours) || 36;
      showEnergy = settings.showEnergy !== false;
      const load = () => {
        document.getElementById('root').classList.add('refreshing');
        return Homey.api('GET', '/', {}).then((v) => { view = v; render(); }).catch((err) => {
          document.getElementById('root').classList.remove('refreshing');
          console.error(err);
        });
      };
      const fit = () => {
        const height = Math.ceil(document.body.scrollHeight);
        if (height !== lastHeight) {
          lastHeight = height;
          Homey.setHeight(height);
        }
      };
      let lastHeight = 0;
      window.addEventListener('rendered', fit);
      load().finally(() => {
        lastHeight = Math.ceil(document.body.scrollHeight);
        Homey.ready({ height: lastHeight });
      });
      Homey.on('plan', load);
      Homey.on('live', load);
      setInterval(load, 10 * 60e3);
      let width = document.body.clientWidth;
      window.addEventListener('resize', () => { if (document.body.clientWidth !== width) { width = document.body.clientWidth; render(); } });
    }
  </script>
</body>
</html>
