<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: baseline; }
    .legend { display: flex; gap: var(--homey-su-2); margin-top: var(--homey-su-1); }
    .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; background: var(--c); }
    svg { display: block; width: 100%; height: 170px; margin-top: var(--homey-su-1); }
    .axis { font-size: 10px; fill: var(--homey-text-color-light); }
    #message { color: var(--homey-text-color-light); }
  </style>
</head>
<body class="homey-widget">
  <div class="header">
    <div class="homey-text-bold">Battery plan</div>
    <div class="homey-text-small-light" id="status"></div>
  </div>
  <div class="homey-text-small" id="summary"></div>
  <svg id="chart" viewBox="0 0 400 170" preserveAspectRatio="none"></svg>
  <div class="legend homey-text-small-light">
    <span style="--c: var(--homey-color-green)">Charge</span>
    <span style="--c: var(--homey-color-orange)">Hold</span>
    <span style="--c: var(--homey-color-blue)">Price</span>
    <span style="--c: var(--homey-text-color)">SOC</span>
  </div>
  <div class="homey-text-small" id="message"></div>

  <script type="text/javascript">
    const NS = 'http://www.w3.org/2000/svg';
    const W = 400, H = 150, TOP = 8;

    function el(name, attrs) {
      const node = document.createElementNS(NS, name);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      return node;
    }

    function hhmm(iso, tz) {
      return new Date(iso).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: tz });
    }

    function render(view) {
      const svg = document.getElementById('chart');
      svg.replaceChildren();
      if (!view.ready) {
        document.getElementById('message').textContent = view.reason || 'Waiting for the first plan…';
        return;
      }
      document.getElementById('message').textContent = view.warnings.join(' · ');
      document.getElementById('status').textContent =
        `${view.controlMode === 'auto' ? 'Automatic' : 'Monitor only'} · SOC ${view.socPct ?? '–'}% · reserve ${view.reserveSoc}%`;
      document.getElementById('summary').textContent = view.slots.length
        ? view.slots.map((s) => `${s.currentA > 0 ? 'Charge' : 'Hold'} ${s.start}–${s.end}`).join(', ') + ` · saves ~${view.savingsSek.toFixed(0)} kr`
        : 'No grid charging planned';

      const n = view.intervals.length;
      const maxPrice = Math.max(...view.intervals.map((i) => i.buy)) * 1.1;
      const x = (i) => (i / n) * W;
      const yPrice = (p) => TOP + H - (p / maxPrice) * H;
      const ySoc = (s) => TOP + H - (s / 100) * H;

      view.intervals.forEach((iv, i) => {
        if (iv.action === 'self_use') return;
        svg.appendChild(el('rect', {
          x: x(i), y: TOP, width: W / n + 0.3, height: H, opacity: 0.25,
          fill: iv.action === 'charge' ? 'var(--homey-color-green)' : 'var(--homey-color-orange)',
        }));
      });

      let pricePath = '';
      view.intervals.forEach((iv, i) => {
        pricePath += `${i === 0 ? 'M' : 'L'}${x(i)},${yPrice(iv.buy)} L${x(i + 1)},${yPrice(iv.buy)} `;
      });
      svg.appendChild(el('path', { d: pricePath, fill: 'none', stroke: 'var(--homey-color-blue)', 'stroke-width': 1.5 }));

      const socPath = view.intervals.map((iv, i) => `${i === 0 ? 'M' : 'L'}${x(i + 1)},${ySoc(iv.soc)}`).join(' ');
      svg.appendChild(el('path', { d: socPath, fill: 'none', stroke: 'var(--homey-text-color)', 'stroke-width': 1, 'stroke-dasharray': '3 2' }));

      const reserveY = ySoc(view.reserveSoc);
      svg.appendChild(el('line', { x1: 0, x2: W, y1: reserveY, y2: reserveY, stroke: 'var(--homey-color-red)', 'stroke-width': 0.5, 'stroke-dasharray': '2 3' }));

      for (let i = 0; i < n; i += 16) {
        const label = el('text', { x: x(i) + 2, y: TOP + H + 11, class: 'axis' });
        label.textContent = hhmm(view.intervals[i].start, view.timeZone);
        svg.appendChild(label);
      }
      const priceLabel = el('text', { x: 2, y: TOP + 9, class: 'axis' });
      priceLabel.textContent = `${maxPrice.toFixed(1)} kr/kWh`;
      svg.appendChild(priceLabel);
    }

    function onHomeyReady(Homey) {
      const load = () => Homey.api('GET', '/', {})
        .then(render)
        .catch((err) => { document.getElementById('message').textContent = String(err); });
      load().finally(() => Homey.ready());
      setInterval(load, 5 * 60_000);
    }
  </script>
</body>
</html>
